<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Navegación - Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body {
            background: #080b09; color: #d1dad2; font-family: 'Courier New', Courier, monospace;
            padding: 0; margin: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-y: auto;
            background-image: 
                linear-gradient(rgba(8, 11, 9, 0.92), rgba(8, 11, 9, 0.96)),
                linear-gradient(to right, #162419 1px, transparent 1px),
                linear-gradient(to bottom, #162419 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
        .terminal-consola {
            width: 100%; max-width: 950px; margin: 20px; background: #040605; border: 2px solid #223526;
            border-top: 6px solid #4a6b52; border-radius: 4px; padding: 30px; box-sizing: border-box;
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(74, 107, 82, 0.15); position: relative;
        }
        .top-bar-actions { position: absolute; top: 8px; right: 12px; display: flex; align-items: center; gap: 15px; }
        .session-top { font-size: 0.75rem; color: #ff6b6b; font-weight: bold; }
        .btn-admin-oculto {
            display: none; background: #1a160d; border: 1px solid #bfa054; color: #bfa054; padding: 3px 8px;
            font-size: 0.65rem; text-transform: uppercase; font-weight: bold; cursor: pointer; border-radius: 2px; text-decoration: none;
        }
        .btn-admin-oculto:hover { background: #bfa054; color: #040605; }
        .header-tactico { text-align: center; margin-bottom: 25px; border-bottom: 1px dashed #223526; padding-bottom: 15px; }
        .header-tactico h1 { color: #6da077; text-transform: uppercase; margin: 0; font-size: 2.2rem; letter-spacing: 4px; }
        .contenedor-radar-central { display: flex; justify-content: center; margin: 20px 0; position: relative; }
        .pantalla-radar {
            width: 240px; height: 240px; background: #040705; border: 3px solid #203825; border-radius: 50%;
            position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(109, 160, 119, 0.2);
        }
        .pantalla-radar::before {
            content: ""; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background: conic-gradient(from 0deg, rgba(109, 160, 119, 0.25) 0deg, transparent 90deg, transparent 360deg);
            animation: barrido 3.5s linear infinite; pointer-events: none;
        }
        .pantalla-radar::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle, transparent 35%, rgba(22, 36, 25, 0.4) 36%, transparent 38%, transparent 68%, rgba(22, 36, 25, 0.4) 69%, transparent 71%),
                linear-gradient(to right, rgba(32, 56, 37, 0.3) 1px, transparent 1px), linear-gradient(to bottom, rgba(32, 56, 37, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 50% 100%, 100% 50%; pointer-events: none;
        }
        @keyframes barrido { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .blip-objetivo {
            position: absolute; width: 8px; height: 8px; background: #ffd875; border-radius: 50%;
            box-shadow: 0 0 10px #ffd875; animation: pulso-blip 1.5s infinite ease-in-out;
        }
        @keyframes pulso-blip { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .seccion-clasificacion { background: #060907; border: 1px solid #223526; border-radius: 3px; padding: 15px; margin-top: 25px; }
        .seccion-clasificacion h3 { margin: 0 0 12px 0; font-size: 0.9rem; color: #bfa054; text-transform: uppercase; border-bottom: 1px dashed #223526; padding-bottom: 6px; }
        .tabla-ranking { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; }
        .tabla-ranking th { color: #6da077; padding: 6px; border-bottom: 1px solid #1c2e21; text-transform: uppercase; }
        .tabla-ranking td { padding: 8px 6px; border-bottom: 1px dashed #111a13; color: #a4b3a7; }
        .menu-interactivo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 25px; }
        .btn-consola { background: #0f1712; border: 1px solid #2d4533; border-radius: 3px; padding: 15px 10px; color: #e2e8e3; text-decoration: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .btn-consola:hover { background: #18241c; border-color: #4a6b52; }
        .modal-oculta { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(4,6,5,0.9); }
        .modal-contenido { background: #060907; margin: 12% auto; padding: 25px; border: 2px solid #38523f; width: 85%; max-width: 500px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="terminal-consola">
        <div class="top-bar-actions">
            <a href="admin.html" id="btnComando" class="btn-admin-oculto">⚡ Panel Comando</a>
            <div id="indicadorSesion" class="session-top">🔴 CONECTANDO...</div>
        </div>
        
        <div class="header-tactico">
            <h1>Airsoft Negreira</h1>
            <p style="color: #bfa054; font-size: 0.85rem; margin: 5px 0 0 0; text-transform: uppercase; letter-spacing: 3px;">Consola de Misión Activa</p>
        </div>

        <div class="contenedor-radar-central">
            <div class="pantalla-radar" id="radarPantalla"></div>
        </div>

        <div class="menu-interactivo">
            <a href="login.html" class="btn-consola">
                <span style="font-size:1.3rem;">🔑</span>
                <strong style="font-size:0.8rem; text-transform:uppercase; margin-top:5px;">Terminal Acceso</strong>
            </a>
            <div class="btn-consola" onclick="desplegarseEnPartida()" style="border-color: #6da077;">
                <span style="font-size:1.3rem;">🔫</span>
                <strong style="font-size:0.8rem; text-transform:uppercase; margin-top:5px; color:#6da077;">Confirmar Despliegue</strong>
            </div>
            <div class="btn-consola" onclick="abrirModalPartidas()">
                <span style="font-size:1.3rem;">🛰️</span>
                <strong style="font-size:0.8rem; text-transform:uppercase; margin-top:5px; color:#bfa054;">Datos Radar</strong>
            </div>
        </div>

        <div class="seccion-clasificacion">
            <h3>📊 Clasificación General de Operadores</h3>
            <table class="tabla-ranking">
                <thead>
                    <tr><th>Indicativo Militar</th><th>Especialidad</th><th>Rango Operativo</th><th>Estado</th></tr>
                </thead>
                <tbody id="tablaCuerpoClasificacion">
                    <tr><td colspan="4" style="text-align: center; color: #728576; padding: 15px;">Estableciendo enlace de red estricto...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modalPartidas" class="modal-oculta">
        <div class="modal-contenido">
            <span style="float:right; cursor:pointer; color:#51755a; font-size:20px;" onclick="cerrarModalPartidas()">&times;</span>
            <h3 style="color:#6da077; text-transform:uppercase; margin-top:0;">📟 Objetivos de la Operación</h3>
            <div id="contenedorInfoPartida"></div>
        </div>
    </div>

<script>
    window.onload = function() {
        if (!window.supabaseClient) {
            document.getElementById("indicadorSesion").innerText = "🔴 ERROR: ESTRUCTURA SUPABASE ERRÓNEA";
            return;
        }
        conectarYVerificarTodo();
    };

    async function conectarYVerificarTodo() {
        const usuarioActivo = localStorage.getItem("usuarioLogueado");
        const indicador = document.getElementById("indicadorSesion");

        try {
            const { data: jugadores, error } = await window.supabaseClient
                .from("jugadores")
                .select("usuario, rol_juego, es_admin, en_partida");

            if (error) throw error;

            if (usuarioActivo) {
                indicador.innerText = `🟢 OP: ${usuarioActivo.toUpperCase()}`;
                indicador.style.color = "#6da077";

                const actual = jugadores.find(u => u.usuario === usuarioActivo);
                if (actual && actual.es_admin === true) {
                    document.getElementById("btnComando").style.display = "inline-block";
                }
            } else {
                indicador.innerText = "🟢 EN LÍNEA";
                indicador.style.color = "#6da077";
            }

            renderizarTabla(jugadores);
            generarPuntosRadar(jugadores);

        } catch (err) {
            indicador.innerText = "🔴 ERROR DE ENLACE";
            indicador.style.color = "#ff6b6b";
            document.getElementById("tablaCuerpoClasificacion").innerHTML = 
                `<tr><td colspan="4" style="text-align:center; color:#ff6b6b; font-weight:bold;">[RED CAÍDA] Revisa las credenciales de red.</td></tr>`;
        }
    }

    function renderizarTabla(lista) {
        const tabla = document.getElementById("tablaCuerpoClasificacion");
        if(!lista || lista.length === 0) {
            tabla.innerHTML = `<tr><td colspan="4" style="text-align:center;">No hay operadores registrados.</td></tr>`;
            return;
        }
        let html = "";
        lista.forEach(j => {
            const rango = j.es_admin ? "<span style='color:#bfa054;'>[CMD] ALTO MANDO</span>" : "OPERADOR";
            const estado = j.en_partida ? "<span style='color:#6da077;'>● DESPLEGADO</span>" : "<span style='color:#728576;'>○ BASE</span>";
            html += `<tr><td><strong>${(j.usuario || 'N/N').toUpperCase()}</strong></td><td>${j.rol_juego || 'Asalto'}</td><td>${rango}</td><td>${estado}</td></tr>`;
        });
        tabla.innerHTML = html;
    }

    function generarPuntosRadar(lista) {
        const radar = document.getElementById("radarPantalla");
        radar.innerHTML = "";
        const desplegados = lista.filter(j => j.en_partida === true);
        
        desplegados.forEach(() => {
            const blip = document.createElement("div");
            blip.className = "blip-objetivo";
            const angulo = Math.random() * Math.PI * 2;
            const radio = Math.random() * 80 + 15;
            const x = Math.floor(116 + Math.cos(angulo) * radio);
            const y = Math.floor(116 + Math.sin(angulo) * radio);
            blip.style.left = `${x}px`;
            blip.style.top = `${y}px`;
            radar.appendChild(blip);
        });
    }

    async function desplegarseEnPartida() {
        const usuario = localStorage.getItem("usuarioLogueado");
        if (!usuario) { alert("Inicia sesión primero."); return; }

        try {
            await window.supabaseClient.from("jugadores").update({ en_partida: true }).eq("usuario", usuario);
            alert("Despliegue confirmado.");
            conectarYVerificarTodo();
        } catch(e) { alert("Error al actualizar estado."); }
    }

    function abrirModalPartidas() {
        document.getElementById("modalPartidas").style.display = "block";
        consultarPartidasYJugadores();
    }
    function cerrarModalPartidas() { document.getElementById("modalPartidas").style.display = "none"; }

    async function consultarPartidasYJugadores() {
        const contenedor = document.getElementById("contenedorInfoPartida");
        contenedor.innerHTML = "<p>Buscando misiones...</p>";
        try {
            const { data: partida } = await window.supabaseClient.from("partidas").select("nombre, tipo_partida").eq("activa", true).maybeSingle();
            contenedor.innerHTML = partida ? `<p><strong>Misión:</strong> <span style='color:#bfa054;'>${partida.nombre}</span></p><p><strong>Modo:</strong> ${partida.tipo_partida}</p>` : "<p style='color:#728576;'>Zona despejada. No hay misiones activas.</p>";
        } catch (e) { contenedor.innerHTML = "<p>Fallo de respuesta.</p>"; }
    }
</script>
</body>
</html>
