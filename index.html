<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Navegación - Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body {
            background: #0a0d0b;
            color: #e2e8e3;
            font-family: 'Courier New', Courier, monospace;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(#141f16 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Contenedor central de la terminal */
        .contenedor-interfaz {
            position: relative;
            max-width: 100%;
            width: 1024px;
            margin: 20px;
            box-shadow: 0px 0px 50px rgba(18, 38, 23, 0.7);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #1f3324;
        }

        /* Imagen de la consola responsiva */
        .interfaz-img {
            display: block;
            width: 100%;
            height: auto;
        }

        area {
            cursor: pointer;
        }
        
        /* Ventana flotante de información (Modal) */
        .modal-oculta { 
            display: none; 
            position: fixed; 
            z-index: 10000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(4, 8, 5, 0.9); 
            backdrop-filter: blur(4px); 
        }
        .modal-contenido { 
            background-color: #090d0a; 
            margin: 12% auto; 
            padding: 30px; 
            border: 2px solid #5a7f62; 
            width: 85%; 
            max-width: 520px; 
            border-radius: 4px; 
            color: #e0e5e1; 
            position: relative; 
            box-shadow: 0 0 30px rgba(90, 127, 98, 0.3);
        }
        .cerrar-modal { position: absolute; top: 10px; right: 15px; color: #5a7f62; font-size: 28px; font-weight: bold; cursor: pointer; }
        .cerrar-modal:hover { color: #c29946; }
        .lista-jugadores { background: #101612; padding: 15px; border: 1px solid #1f3324; border-radius: 3px; margin-top: 15px; max-height: 200px; overflow-y: auto; }
        .lista-jugadores ul { list-style: none; padding: 0; margin: 5px 0 0 0; }
        .lista-jugadores li { padding: 6px 0; border-bottom: 1px dashed #1a261c; font-size: 0.95rem; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/imageMapResizer.min.js"></script>
</head>
<body>

    <div class="contenedor-interfaz">
        <img src="http://googleusercontent.com/image_generation_content/3.png" alt="Consola de Navegación Negreira" usemap="#menu-tactico" class="interfaz-img">

        <map name="menu-tactico">
            <area shape="rect" coords="65,650,265,910" href="login.html" alt="Acceso Operador">

            <area shape="rect" coords="285,650,490,910" href="tabla.html" alt="Marcador Global">

            <area shape="circle" coords="625,820,80" href="#" onclick="abrirModalPartidas(); return false;" alt="Ver Despliegue">
        </map>
    </div>

    <div id="modalPartidas" class="modal-oculta">
        <div class="modal-contenido">
            <span class="cerrar-modal" onclick="cerrarModalPartidas()">&times;</span>
            <h3 style="color: #7fa984; text-transform: uppercase; text-align: center; margin-top: 0; letter-spacing: 2px;">📟 Datos del Terreno</h3>
            <hr style="border: 0; border-top: 1px solid #1f3324; margin-bottom: 15px;">
            <div id="contenedorInfoPartida"></div>
        </div>
    </div>

<script>
    // Inicialización del redimensionador automático del mapa de imágenes
    document.addEventListener("DOMContentLoaded", () => {
        imageMapResize();
        chequearSesionSilenciosa();
    });

    let usuarioLogueadoId = null;

    async function chequearSesionSilenciosa() {
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        if (session && session.user) {
            usuarioLogueadoId = session.user.id;
        }
    }

    function abrirModalPartidas() {
        document.getElementById("modalPartidas").style.display = "block";
        consultarPartidasYJugadores();
    }

    function cerrarModalPartidas() {
        document.getElementById("modalPartidas").style.display = "none";
    }

    async function consultarPartidasYJugadores() {
        const contenedor = document.getElementById("contenedorInfoPartida");
        contenedor.innerHTML = "<p style='text-align:center; color:#7fa984;'>Enlazando con el sector de Negreira...</p>";

        const { data: partida, error: errorPartida } = await window.supabaseClient
            .from("partidas")
            .select("*")
            .eq("activa", true)
            .maybeSingle();

        if (errorPartida) {
            contenedor.innerHTML = "<p style='color:#ff8a8a;'>Error en el enlace de datos del servidor.</p>";
            return;
        }

        if (!partida) {
            contenedor.innerHTML = "<p style='text-align:center; color:#888;'>[ZONA LIBRE] No se registran actividades programadas en el mapa.</p>";
            return;
        }

        const { data: jugadores, error: errorJugadores } = await window.supabaseClient
            .from("jugadores")
            .select("id, usuario, rol_juego")
            .eq("en_partida", true);

        if (errorJugadores) {
            contenedor.innerHTML = "<p style='color:#ff8a8a;'>No se pudo verificar la lista de participantes.</p>";
            return;
        }

        let htmlContenido = `
            <p><strong>Sector Activo:</strong> <span style="color:#c29946;">${partida.nombre || 'Reconocimiento de Terreno'}</span></p>
            <p><strong>Fecha Programada:</strong> ${partida.fecha || 'Sin fijar'}</p>
            <p><strong>Personal en Zona:</strong> ${jugadores.length} operadores</p>
        `;

        if (jugadores.length === 0) {
            htmlContenido += "<p style='color:#666; font-size:0.9em; margin-top:15px; text-align:center;'>Ningún miembro se ha posicionado en el cuadrante aún.</p>";
        } else {
            htmlContenido += `
                <div class="lista-jugadores">
                    <strong style="color:#c29946; font-size:0.85rem; text-transform:uppercase;">Personal Registrado:</strong>
                    <ul>`;
            jugadores.forEach(j => {
                htmlContenido += `<li>🌲 <strong>${j.usuario.toUpperCase()}</strong> - <span style='color:#7fa984;'>[${j.rol_juego.toUpperCase()}]</span></li>`;
            });
            htmlContenido += "</ul></div>";
        }

        contenedor.innerHTML = htmlContenido;
    }
</script>
</body>
</html>
