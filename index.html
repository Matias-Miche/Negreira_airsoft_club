<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcador - Airsoft Negreira</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .contenedor-login,
        .contenedor-marcador {
            background: #0b0b0b;
            padding: 25px;
            border-radius: 10px;
            border: 3px solid #4a5d4e;
            width: 100%;
            max-width: 650px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        h2, h3 {
            color: #7fa984;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #2b2b2b;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #4a5d4e;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #5c7461;
        }

        .btn:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
        }

        .barra-registro {
            margin-top: 15px;
            text-align: center;
            padding-top: 10px;
            border-top: 1px solid #2b2b2b;
            color: #aaa;
        }

        .barra-registro a {
            color: #7fa984;
            text-decoration: none;
            font-weight: bold;
        }

        .barra-registro a:hover {
            text-decoration: underline;
        }

        .alerta {
            background: #7f2d2d;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            border: 1px solid #a93c3c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #222;
        }

        th {
            color: #7fa984;
        }

        .etiqueta-rol {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .rol-medico { background: #8a2be2; }
        .rol-asalto { background: #ce2029; }
        .rol-ametrallador { background: #d2691e; }
        .rol-tirador { background: #008080; }
        .rol-defecto { background: #555; }
    </style>
</head>

<body>

    <div class="contenedor-login" id="bloque-login">
        <h2>Ingreso de Operadores</h2>
        <div class="alerta" id="error-login"></div>
        
        <input type="text" id="login-usuario" placeholder="Nombre de Usuario o Correo">
        <input type="password" id="login-password" placeholder="Contraseña">
        <button class="btn" id="btn-entrar" onclick="iniciarSesion()">Entrar al Perfil</button>

        <div class="barra-registro">
            ¿Eres nuevo? <a href="registro.html">Crear una cuenta de Operador</a>
        </div>
    </div>

    <div class="contenedor-marcador">
        <h3 id="info-partida">Buscando señales tácticas...</h3>
        <p id="fecha-partida" style="text-align:center; color:#aaa;"></p>
        
        <div id="alerta-boss" style="display:none; background:#b33939; padding:10px; text-align:center; font-weight:bold; margin-bottom:10px; border-radius:5px;">
            ⚠️ ¡ATENCIÓN: EL JUGGERNAUT ESTÁ EN EL CAMPO!
        </div>

        <table>
            <thead>
                <tr>
                    <th>Operador</th>
                    <th>Rol</th>
                    <th>Puntos</th>
                </tr>
            </thead>
            <tbody id="tabla-marcador">
                <tr>
                    <td colspan="3" style="text-align:center; color: #888;">Cargando datos del marcador...</td>
                </tr>
            </tbody>
        </table>
    </div>

<script>
    // Ejecución inicial segura al cargar la web
    document.addEventListener("DOMContentLoaded", async () => {
        // Validación preventiva de la existencia del SDK de Supabase
        if (!window.supabaseClient) {
            console.error("Error crítico: El archivo 'supabase.js' no está cargado correctamente o no inicializó window.supabaseClient.");
            document.getElementById("info-partida").innerText = "Error: Fallo de conexión con la base de datos";
            return;
        }

        try {
            const { data: { session }, error } = await window.supabaseClient.auth.getSession();
            if (!error && session) {
                // Si ya está logueado de antes, transformamos la tarjeta para evitar que vuelva a meter datos
                document.getElementById("bloque-login").innerHTML = `
                    <h2>Sesión Detectada</h2>
                    <p style="text-align:center; margin-bottom:15px; color:#aaa;">Tienes una sesión táctica abierta.</p>
                    <button class="btn" onclick="window.location.href='perfil.html'">Ir a mi Perfil</button>
                `;
            }
        } catch (e) {
            console.error("Error al comprobar sesión previa:", e);
        }

        // Lanzamiento inicial y bucle en segundo plano cada 10 segundos
        cargarSistema();
        setInterval(cargarSistema, 10000);
    });

    // Función de Login Blindada contra la doble arroba (@) e inyecciones vacías
    async function iniciarSesion() {
        const usuarioInput = document.getElementById("login-usuario");
        const passwordInput = document.getElementById("login-password");
        const btnEntrar = document.getElementById("btn-entrar");
        const divError = document.getElementById("error-login");

        const usuario = usuarioInput.value.trim().toLowerCase();
        const contra = passwordInput.value;

        divError.style.display = "none";

        // Protección 1: Campos vacíos
        if (!usuario || !contra) {
            divError.innerText = "Error: Introduce tu operador/correo y contraseña.";
            divError.style.display = "block";
            return;
        }

        // Protección 2: Evitar que el botón sea pulsado varias veces durante el proceso
        btnEntrar.disabled = true;
        btnEntrar.innerText = "Autenticando...";

        // Protección 3: Análisis inteligente del identificador (¿Es correo o usuario estándar?)
        const emailFinal = usuario.includes("@") ? usuario : usuario + "@airsoft.local";

        try {
            const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                email: emailFinal,
                password: contra
            });

            if (error) {
                divError.innerText = "Acceso denegado: Usuario o contraseña incorrectos.";
                divError.style.display = "block";
                btnEntrar.disabled = false;
                btnEntrar.innerText = "Entrar al Perfil";
                return;
            }

            // Redirección limpia e inmediata si todo es correcto
            window.location.href = "perfil.html";

        } catch (err) {
            console.error("Excepción en Login:", err);
            divError.innerText = "Fallo crítico en el servidor de autenticación. Inténtalo de nuevo.";
            divError.style.display = "block";
            btnEntrar.disabled = false;
            btnEntrar.innerText = "Entrar al Perfil";
        }
    }

    // Carga de datos del marcador en tiempo real unificado desde la tabla "profiles"
    async function cargarSistema() {
        try {
            // Consulta 1: Estado de las partidas públicas activas
            const { data: partidaActiva, error: errPartida } = await window.supabaseClient
                .from("partidas")
                .select("*")
                .eq("activa", true)
                .maybeSingle();

            if (!errPartida && partidaActiva) {
                document.getElementById("info-partida").innerText = "Partida: " + partidaActiva.nombre;
                document.getElementById("fecha-partida").innerText = "Fecha/Hora: " + (partidaActiva.fecha || "No indicada");
            } else {
                document.getElementById("info-partida").innerText = "Sin partidas activas en el radar";
                document.getElementById("fecha-partida").innerText = "";
            }

            // Consulta 2: Extracción de competidores y puntuaciones desde "profiles" (Unificado)
            const { data: jugadores, error: errJugadores } = await window.supabaseClient
                .from("profiles")
                .select("*")
                .order("puntos", { ascending: false });

            const tbody = document.getElementById("tabla-marcador");
            
            if (errJugadores) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#7f2d2d;">Error al sincronizar el marcador.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            let bossActivo = false;

            if (jugadores && jugadores.length > 0) {
                jugadores.forEach(j => {
                    // Si es cuenta de administrador, verifica si actúa de Juggernaut en el campo sin mostrar sus puntos
                    if (j.username && j.username.toLowerCase().includes("admin")) {
                        if (j.en_partida === true) bossActivo = true; 
                        return;
                    }

                    // Protección contra columnas nulas o indefinidas en tu base de datos
                    const nombreOperador = j.username || "Operador Desconocido";
                    const puntosOperador = j.puntos !== undefined && j.puntos !== null ? j.puntos : 0;
                    const rolJuego = j.rol_juego ? j.rol_juego.trim() : "Sin Asignar";

                    // Asignación dinámica y segura de estilos CSS por rol de juego
                    let estilo = "rol-defecto";
                    if (rolJuego === "Médico") estilo = "rol-medico";
                    if (rolJuego === "Asalto") estilo = "rol-asalto";
                    if (rolJuego === "Ametrallador") estilo = "rol-ametrallador";
                    if (rolJuego === "Tirador designado") estilo = "rol-tirador";

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${nombreOperador}</strong></td>
                            <td><span class="etiqueta-rol ${estilo}">${rolJuego}</span></td>
                            <td><strong>${puntosOperador} PTS</strong></td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#888;">No hay operadores alistados actualmente.</td></tr>`;
            }
            
            // Switch de alerta Juggernaut
            document.getElementById("alerta-boss").style.display = bossActivo ? "block" : "none";

        } catch (ex) {
            console.error("Excepción en la actualización automática:", ex);
        }
    }
</script>

</body>
</html>
