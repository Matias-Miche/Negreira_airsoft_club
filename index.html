            letter-spacing: 2px;
        }

            letter-spacing: 3px;
            margin-top: 5px;

            gap: 20px;

        }

        .texto-monitor {
            font-size: 0.85rem;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

            font-weight: bold;
            color: #8fa694;
            border-radius: 2px;
        }
