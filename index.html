<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcador - Airsoft Negreira</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .contenedor-login, .contenedor-marcador { background-color: #0b0b0b; padding: 25px; border-radius: 8px; border: 3px solid #4a5d4e; width: 100%; max-width: 550px; box-sizing: border-box; margin-bottom: 25px; }
        h2, h3 { color: #7fa984; text-transform: uppercase; text-align: center; margin: 0 0 15px 0; }
        input, select { width: 100%; padding: 10px; background-color: #2b2b2b; border: 1px solid #4a5d4e; border-radius: 4px; color: #fff; box-sizing: border-box; margin-bottom: 15px; }
        .btn-accion { width: 100%; background-color: #4a5d4e; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-accion:hover { background-color: #637d68; }
        
        .alerta-juggernaut { display: none; background-color: #962d2d; border: 3px dashed #ff0000; padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 1.1rem; color: #fff; margin-bottom: 25px; width: 100%; max-width: 550px; box-sizing: border-box; animation: parpadeo 1.5s infinite; }
        @keyframes parpadeo { 0% {opacity: 1;} 50% {opacity: 0.6;} 100% {opacity: 1;} }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #2b2b2b; }
        th { background-color: #4a5d4e; }
        .etiqueta-rol { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        .rol-medico { background-color: #962d2d; } .rol-asalto { background-color: #3b5998; } .rol-ametrallador { background-color: #b87333; } .rol-tirador { background-color: #6b8e23; } .rol-at { background-color: #ff8c00; color: black; }
    </style>
</head>
<body>

    <div id="alerta-boss" class="alerta-juggernaut">
        🚨 ¡EVENTO ESPECIAL DETECTADO! 🚨<br>
        Un Administrador se ha unido a la batalla como JUGGERNAUT. ¡Preparad vuestras tácticas!
    </div>

    <div class="contenedor-login">
        <h2>Ingreso de Operadores</h2>
        <form id="formLogin">
            <input type="text" id="usuario" required placeholder="Tu usuario">
            <input type="password" id="contra" required placeholder="Tu contraseña">
            <button type="submit" class="btn-accion">Entrar al Panel</button>
        </form>
        <a href="registro.html" style="color: #7fa984; display:block; text-align:center; margin-top:10px; text-decoration:none;">¿No tienes perfil? Regístrate</a>
    </div>

    <div class="contenedor-marcador" id="zona-partida" style="display:none;">
        <h3 id="titulo-partida">Cargando partida...</h3>
        <p style="text-align:center; color:#ccc;" id="fecha-partida"></p>
        
        <label>Selecciona tu modalidad (Se paga en mano en el propio campo):</label>
        <select id="tipo-pago">
            <option value="5">Alistarse: 5€ (Traigo mi propia réplica + Seguro de campo obligado)</option>
            <option value="25">Alistarse: 25€ (Alquiler de equipo completo del campo + Seguro obligado)</option>
        </select>
        <button class="btn-accion" onclick="unirseAPartida()">Confirmar Asistencia al Campo</button>
    </div>

    <div class="contenedor-marcador">
        <h3>Marcador General de Operadores</h3>
        <table>
            <thead>
                <tr><th>Operador</th><th>Rol Asignado</th><th>Puntos</th></tr>
            </thead>
            <tbody id="tabla-marcador"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_CH_3b10nSrV6PolJp3Q85w_sFCTAjrp";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioLogueado = localStorage.getItem('usuarioRegistrado');
        if(usuarioLogueado) document.getElementById('zona-partida').style.display = "block";

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const contra = document.getElementById('contra').value;

            const { data } = await supabase.from('jugadores').select('*').eq('usuario', usuario).eq('contrasena', contra).maybeSingle();
            if (data) {
                localStorage.setItem('usuarioRegistrado', usuario);
                alert('¡Acceso autorizado!');
                location.reload();
            } else {
                alert('Datos incorrectos.');
            }
        });

        async function unirseAPartida() {
            const precio = document.getElementById('tipo-pago').value;
            await supabase.from('jugadores').update({ tipo_entrada: precio, en_partida: true }).eq('usuario', usuarioLogueado);
            alert("¡Te has alistado con éxito! Nos vemos en el campo.");
            location.reload();
        }

        async function sistemaEnTiempoReal() {
            const { data: partida } = await supabase.from('partidas').select('*').eq('activa', true).maybeSingle();
            if(partida) {
                document.getElementById('titulo-partida').innerText = "⚔️ NUEVA MISIÓN: " + partida.nombre;
                document.getElementById('fecha-partida').innerText = "Fecha del despliegue: " + partida.fecha;
            }

            const { data: admin } = await supabase.from('jugadores').select('*').eq('usuario', 'Admin').maybeSingle();
            if(admin && admin.en_partida === true) {
                document.getElementById('alerta-boss').style.display = "block";
            }

            const { data: jugadores } = await supabase.from('jugadores').select('*').order('puntos', { ascending: false });
            const tbody = document.getElementById('tabla-marcador');
            tbody.innerHTML = "";

            if (jugadores) {
                jugadores.forEach(j => {
                    if(j.usuario === "Admin") return;
                    let estilo = j.rol === "Medico" ? "rol-medico" : j.rol === "Asalto" ? "rol-asalto" : j.rol === "Ametrallador" ? "rol-ametrallador" : j.rol === "Tirador designado" ? "rol-tirador" : "rol-at";
                    tbody.innerHTML += `<tr><td><strong>${j.usuario}</strong></td><td><span class="etiqueta-rol ${estilo}">${j.rol}</span></td><td><strong>${j.puntos} PTS</strong></td></tr>`;
                });
            }
        }

        sistemaEnTiempoReal();
    </script>
</body>
</html>
