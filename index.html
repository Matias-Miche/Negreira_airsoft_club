<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcador - Airsoft Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .contenedor-login, .contenedor-marcador { background: #0b0b0b; padding: 25px; border-radius: 10px; border: 3px solid #4a5d4e; width: 100%; max-width: 650px; margin-bottom: 25px; box-sizing: border-box; }
        h2, h3 { color: #7fa984; text-transform: uppercase; text-align: center; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #2b2b2b; color: white; border: 1px solid #4a5d4e; border-radius: 5px; box-sizing: border-box; }
        .btn-accion { width: 100%; background: #4a5d4e; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-accion:hover { background: #637d68; }
        .alerta-juggernaut { display: none; background: #962d2d; border: 3px dashed red; padding: 20px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 25px; width: 100%; max-width: 650px; animation: parpadeo 1.5s infinite; }
        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #2b2b2b; }
        th { background: #4a5d4e; }
        .etiqueta-rol { padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .rol-medico { background: #962d2d; }
        .rol-asalto { background: #3b5998; }
        .rol-ametrallador { background: #b87333; }
        .rol-tirador { background: #6b8e23; }
        .rol-at { background: #ff8c00; color: black; }
        .estado { text-align: center; color: #ccc; margin-top: 10px; }
        @media(max-width:768px) { table { font-size: 0.8rem; } th, td { padding: 8px; } }
    </style>
</head>
<body>

<div id="alerta-boss" class="alerta-juggernaut">
    🚨 EVENTO ESPECIAL 🚨 <br><br> ¡Un administrador ha entrado al campo como JUGGERNAUT!
</div>

<div class="contenedor-login" id="bloque-autenticacion">
    <h2>Ingreso de Operadores</h2>
    <form id="formLogin">
        <input type="text" id="usuario" placeholder="Tu usuario" required>
        <input type="password" id="contra" placeholder="Tu contraseña" required>
        <button type="submit" class="btn-accion">Entrar al Panel</button>
    </form>
    <a href="registro.html" style="color:#7fa984; display:block; text-align:center; margin-top:15px; text-decoration:none;">
        ¿No tienes perfil? Regístrate aquí
    </a>
    <div id="estado-login" class="estado"></div>
</div>

<div class="contenedor-marcador" id="zona-partida" style="display:none;">
    <h3 id="titulo-partida">Cargando partida...</h3>
    <p id="fecha-partida" style="text-align:center;color:#ccc; margin-bottom:15px;"></p>
    <label>Selecciona modalidad de asistencia:</label>
    <select id="tipo-pago">
        <option value="5">5€ - Traigo réplica propia</option>
        <option value="25">25€ - Alquiler completo del Club</option>
    </select>
    <button class="btn-accion" onclick="unirseAPartida()">Confirmar Asistencia</button>
</div>

<div class="contenedor-marcador">
    <h3>Marcador General de Operadores</h3>
    <table>
        <thead>
            <tr>
                <th>Operador</th>
                <th>Rol Táctico</th>
                <th>Puntos</th>
            </tr>
        </thead>
        <tbody id="tabla-marcador"></tbody>
    </table>
</div>

<script>
    // Corregido: Uso de cliente global unificado de supabase.js
    document.addEventListener("DOMContentLoaded", comprobarSesion);

    async function comprobarSesion() {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (user) {
            const { data } = await window.supabaseClient
                .from("jugadores")
                .select("usuario")
                .eq("id", user.id)
                .maybeSingle();

            if (data) {
                document.getElementById("zona-partida").style.display = "block";
                document.getElementById("formLogin").style.display = "none";
                document.getElementById("estado-login").innerHTML = `Identificado como: <strong>${data.usuario.toUpperCase()}</strong> | <a href="perfil.html" style="color:#7fa984; text-decoration:none; font-weight:bold;">Ir a mi Perfil</a>`;
            }
        }
        cargarSistema();
        setInterval(cargarSistema, 10000);
    }

    document.getElementById("formLogin").addEventListener("submit", async function(e) {
        e.preventDefault();
        const user = document.getElementById("usuario").value.trim().toLowerCase().replace(/[^a-z0-9@._-]/g, "");
        const pass = document.getElementById("contra").value;
        const estado = document.getElementById("estado-login");

        estado.innerText = "Verificando acceso...";

        if (!user || !pass) {
            estado.innerText = "Completa todos los campos";
            return;
        }

        const email = user.includes("@") ? user : user + "@airsoft.local";

        const { error } = await window.supabaseClient.auth.signInWithPassword({
            email: email,
            password: pass
        });

        if (error) {
            // Corregido: Se eliminó la referencia a 'msg' que rompía el hilo de ejecución
            estado.innerText = "Usuario o contraseña incorrectos";
            return;
        }

        window.location.href = "perfil.html";
    });

    async function unirseAPartida() {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) {
            alert("Debes iniciar sesión");
            return;
        }
        const precio = document.getElementById("tipo-pago").value;
        const { error } = await window.supabaseClient
            .from("jugadores")
            .update({ tipo_entrada: Number(precio), en_partida: true })
            .eq("id", user.id);

        if (error) {
            alert("Error al alistarse en la misión.");
            return;
        }
        alert("¡Te has alistado correctamente!");
        cargarSistema();
    }

    async function cargarSistema() {
        const { data: partida } = await window.supabaseClient
            .from("partidas")
            .select("*")
            .eq("activa", true)
            .maybeSingle();

        if (partida) {
            document.getElementById("titulo-partida").innerText = "⚔️ MISIÓN: " + partida.nombre;
            document.getElementById("fecha-partida").innerText = "Fecha: " + partida.fecha;
        } else {
            document.getElementById("titulo-partida").innerText = "No hay misiones activas";
            document.getElementById("fecha-partida").innerText = "";
        }

        const { data: jugadores } = await window.supabaseClient
            .from("jugadores")
            .select("*")
            .order("puntos", { ascending: false });

        const tbody = document.getElementById("tabla-marcador");
        tbody.innerHTML = "";
        let juggernautActivo = false;

        if (jugadores) {
            jugadores.forEach(j => {
                if (j.rol === "administración" || j.rol === "administracion") {
                    if (j.en_partida) juggernautActivo = true;
                    return;
                }

                let estilo = "rol-at";
                if (j.rol_juego === "Medico" || j.rol_juego === "Médico") estilo = "rol-medico";
                if (j.rol_juego === "Asalto") estilo = "rol-asalto";
                if (j.rol_juego === "Ametrallador") estilo = "rol-ametrallador";
                if (j.rol_juego === "Tirador designado" || j.rol_juego === "Tirador") estilo = "rol-tirador";

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${j.usuario}</strong></td>
                        <td><span class="etiqueta-rol ${estilo}">${j.rol_juego || 'Asalto'}</span></td>
                        <td><strong>${j.puntos || 0} PTS</strong></td>
                    </tr>
                `;
            });
        }
        document.getElementById("alerta-boss").style.display = juggernautActivo ? "block" : "none";
    }
</script>
</body>
</html>
