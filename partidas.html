<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidas</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial; padding: 20px; }
        .box { background: #0b0b0b; padding: 20px; border-radius: 10px; border: 2px solid #4a5d4e; }
        input { padding: 10px; margin-right: 10px; background: #2b2b2b; color: white; border: 1px solid #4a5d4e; }
        button { padding: 10px; background: #4a5d4e; color: white; border: none; cursor: pointer; }
        #lista { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Partidas activas</h2>
        <input id="nombre" placeholder="Nombre partida">
        <input id="fecha" type="date">
        <button onclick="crear()">Crear partida</button>
        <div id="lista"></div>
    </div>
<script>
    async function crear() {
        await window.supabaseClient
            .from("partidas")
            .update({ activa: false })
            .eq("activa", true);

        const nombre = document.getElementById("nombre").value;
        const fecha = document.getElementById("fecha").value;

        await window.supabaseClient
            .from("partidas")
            .insert([{ nombre, fecha, activa: true }]);

        cargar();
    }

    async function cargar() {
        const { data } = await window.supabaseClient
            .from("partidas")
            .select("*")
            .eq("activa", true);

        const lista = document.getElementById("lista");
        if (data && data.length > 0) {
            lista.innerHTML = data.map(p => `<p>⚔️ <strong>${p.nombre}</strong> - ${p.fecha}</p>`).join("");
        } else {
            lista.innerHTML = "<p>No hay partidas activas en este momento.</p>";
        }
    }

    cargar();
</script>
</body>
</html>
