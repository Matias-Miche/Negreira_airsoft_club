<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Operador - Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body {
            background: #080b09; color: #d1dad2; font-family: 'Courier New', Courier, monospace;
            padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: 
                linear-gradient(rgba(8, 11, 9, 0.92), rgba(8, 11, 9, 0.96)),
                linear-gradient(to right, #162419 1px, transparent 1px), linear-gradient(to bottom, #162419 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
        .contenedor-perfil { width: 100%; max-width: 550px; background: #040605; border: 2px solid #223526; border-top: 6px solid #bfa054; border-radius: 4px; padding: 30px; box-sizing: border-box; box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.8); }
        h2 { color: #bfa054; text-transform: uppercase; margin-top: 0; letter-spacing: 2px; font-size: 1.4rem; text-align: center; border-bottom: 1px dashed #223526; padding-bottom: 12px; }
        .info-bloque { background: #0f1712; border: 1px solid #2d4533; padding: 15px; border-radius: 3px; margin-bottom: 20px; }
        .info-linea { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .info-linea span { color: #6da077; font-weight: bold; }
        .campo { margin-bottom: 15px; }
        label { color: #a4b3a7; display: block; margin-bottom: 6px; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        select { width: 100%; padding: 11px; background: #0f1712; color: #e2e8e3; border: 1px solid #2d4533; border-radius: 3px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background: #1e3825; color: #bfa054; border: 1px solid #4a6b52; border-radius: 3px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; margin-top: 10px; }
        button:hover { background: #274930; color: #ffd875; }
        .nav-links { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px dashed #223526; padding-top: 15px; font-size: 0.8rem; }
        .link-btn { color: #6da077; text-decoration: none; text-transform: uppercase; font-weight: bold; }
        .link-btn:hover { color: #bfa054; }
    </style>
</head>
<body>

    <div class="contenedor-perfil">
        <h2>🪪 Expediente de Operador</h2>
        
        <div class="info-bloque">
            <div class="info-linea">Indicativo Militar: <span id="perfUsuario">-</span></div>
            <div class="info-linea">Rango Operativo: <span id="perfRango">-</span></div>
            <div class="info-linea">Estado en Red: <span id="perfEstado">-</span></div>
        </div>

        <div class="campo">
            <label>⚔️ Cambiar Especialidad de Combate:</label>
            <select id="selectRol" onchange="actualizarEspecialidad()">
                <option value="Asalto">Asalto</option>
                <option value="Médico">Médico</option>
                <option value="Tirador Selecto">Tirador Selecto (DMR)</option>
                <option value="Sniper">Sniper</option>
                <option value="Apoyo">Apoyo</option>
            </select>
        </div>

        <div class="campo">
            <label>🛰️ Desplegarse en Misión Activa:</label>
            <select id="selectPartida">
                <option value="">-- No hay misiones disponibles --</option>
            </select>
        </div>

        <button onclick="confirmarDespliegueMision()">Confirmar Orden de Despliegue</button>
        
        <div class="nav-links">
            <a href="index.html" class="link-btn">🛰️ Ver Radar</a>
            <a href="#" onclick="cerrarSesion()" class="link-btn" style="color:#ff6b6b;">🔒 Desconectar</a>
        </div>
    </div>

<script>
    let usuarioLogueado = localStorage.getItem("usuarioLogueado");

    window.onload = function() {
        if (!usuarioLogueado) {
            alert("Acceso denegado. Inicia sesión.");
            window.location.href = "login.html";
            return;
        }
        cargarDatosPerfil();
        cargarPartidasDisponibles();
    };

    async function cargarDatosPerfil() {
        try {
            const { data: jugador, error } = await window.supabaseClient
                .from("jugadores")
                .select("usuario, rol_juego, es_admin, en_partida")
                .ilike("usuario", usuarioLogueado)
                .maybeSingle();

            if (error || !jugador) return;

            document.getElementById("perfUsuario").innerText = jugador.usuario.toUpperCase();
            document.getElementById("perfRango").innerText = jugador.es_admin ? "ALTO MANDO (CMD)" : "OPERADOR DE CAMPO";
            document.getElementById("perfEstado").innerText
