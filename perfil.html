<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Operador - Negreira</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: #080b09; color: #d1dad2; font-family: 'Courier New', Courier, monospace;
            padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: 
                linear-gradient(rgba(8, 11, 9, 0.92), rgba(8, 11, 9, 0.96)),
                linear-gradient(to right, #162419 1px, transparent 1px), linear-gradient(to bottom, #162419 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
        .contenedor-perfil { width: 100%; max-width: 550px; background: #040605; border: 2px solid #223526; border-top: 6px solid #bfa054; border-radius: 4px; padding: 30px; box-sizing: border-box; box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.8); }
        h2 { color: #bfa054; text-transform: uppercase; margin-top: 0; letter-spacing: 2px; font-size: 1.4rem; text-align: center; border-bottom: 1px dashed #223526; padding-bottom: 12px; }
        .info-bloque { background: #0f1712; border: 1px solid #2d4533; padding: 15px; border-radius: 3px; margin-bottom: 20px; }
        .info-linea { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .info-linea span { color: #6da077; font-weight: bold; }
        .campo { margin-bottom: 15px; }
        label { color: #a4b3a7; display: block; margin-bottom: 6px; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        select { width: 100%; padding: 11px; background: #0f1712; color: #e2e8e3; border: 1px solid #2d4533; border-radius: 3px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background: #1e3825; color: #bfa054; border: 1px solid #4a6b52; border-radius: 3px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; margin-top: 10px; }
        button:hover { background: #274930; color: #ffd875; }
        .nav-links { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px dashed #223526; padding-top: 15px; font-size: 0.8rem; }
        .link-btn { color: #6da077; text-decoration: none; text-transform: uppercase; font-weight: bold; }
        .link-btn:hover { color: #bfa054; }
    </style>
</head>
<body>

    <div class="contenedor-perfil">
        <h2>🪪 Expediente de Operador</h2>
        
        <div class="info-bloque">
            <div class="info-linea">Indicativo Militar: <span id="perfUsuario">CARGANDO...</span></div>
            <div class="info-linea">Rango Militar: <span id="perfRango">CARGANDO...</span></div>
            <div class="info-linea">Puntos de Honor: <span id="perfPuntos" style="color: #bfa054;">CARGANDO...</span></div>
            <div class="info-linea">Estado en Red: <span id="perfEstado">CARGANDO...</span></div>
        </div>

        <div class="campo">
            <label>⚔️ Cambiar Especialidad de Combate:</label>
            <select id="selectRol" onchange="actualizarEspecialidad()">
                <option value="Asalto">Asalto</option>
                <option value="Médico">Médico</option>
                <option value="Tirador Selecto">Tirador Selecto (DMR)</option>
                <option value="Sniper">Sniper</option>
                <option value="Apoyo">Apoyo</option>
            </select>
        </div>

        <div class="campo">
            <label>🛰️ Desplegarse en Misión Activa:</label>
            <select id="selectPartida">
                <option value="">-- No hay misiones disponibles --</option>
            </select>
        </div>

        <button onclick="confirmarDespliegueMision()">Confirmar Orden de Despliegue</button>
        
        <div class="nav-links">
            <a href="index.html" class="link-btn">🛰️ Ver Radar</a>
            <a href="#" onclick="cerrarSesion()" class="link-btn" style="color:#ff6b6b;">🔒 Desconectar</a>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://wbcfszivrbuqfqnizarq.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndiY2Zzeml2cmJ1cWZxbml6YXJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTkyMjEsImV4cCI6MjA5NTQ3NTIyMX0.2iX7Twex3d96A9Iawg3zxvGAjFNLBqt81tSZgrzqA9s";

    let supabaseLocal;
    let usuarioLogueado = localStorage.getItem("usuarioLogueado") ? localStorage.getItem("usuarioLogueado").trim() : null;

    window.onload = function() {
        if (!usuarioLogueado) {
            alert("Acceso denegado. Por favor, inicia sesión primero.");
            window.location.href = "login.html";
            return;
        }
        try {
            supabaseLocal = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            cargarDatosPerfil();
            cargarPartidasDisponibles();
        } catch (e) {
            fallbackCampos("ERROR CONFIG");
        }
    };

    function calcularRangoMilitar(puntos) {
        if (puntos < 100) return "RECLUTA (LVL 1)";
        if (puntos < 200) return "SOLDADO DE 1ª (LVL 2)";
        if (puntos < 300) return "CABO TÁCTICO (LVL 3)";
        if (puntos < 400) return "CABO PRIMERO (LVL 4)";
        if (puntos < 500) return "SARGENTO DE INFANTERÍA (LVL 5)";
        if (puntos < 600) return "SARGENTO PRIMERO (LVL 6)";
        if (puntos < 700) return "BRIGADA OPERATIVO (LVL 7)";
        if (puntos < 800) return "SUBTENIENTE DE CAMPO (LVL 8)";
        if (puntos < 900) return "ALFÉREZ (LVL 9)";
        if (puntos < 1000) return "TENIENTE DE ASALTO (LVL 10)";
        if (puntos < 1100) return "CAPITÁN DE ESCUADRÓN (LVL 11)";
        if (puntos < 1200) return "MAYOR TÁCTICO (LVL 12)";
        if (puntos < 1300) return "TENIENTE CORONEL (LVL 13)";
        if (puntos < 1400) return "CORONEL DE ASALTO (LVL 14)";
        if (puntos < 1500) return "GENERAL DE BRIGADA (LVL 15)";
        return "⚡ COMANDANTE DE LA FLOTA (MAX)";
    }

    async function cargarDatosPerfil() {
        try {
            const { data: jugador, error } = await supabaseLocal
                .from("jugadores")
                .select("usuario, rol_juego, puntos, en_partida")
                .ilike("usuario", usuarioLogueado)
                .maybeSingle();

            if (error) {
                fallbackCampos("FALLO DE RED");
                return;
            }

            if (jugador) {
                const pts = jugador.puntos || 0;
                document.getElementById("perfUsuario").innerText = jugador.usuario.toUpperCase();
                document.getElementById("perfPuntos").innerText = pts + " PTS";
                document.getElementById("perfRango").innerText = calcularRangoMilitar(pts);
                document.getElementById("perfEstado").innerText = jugador.en_partida ? "🔴 EN COMBATE" : "🟢 EN BASE";
                
                if (jugador.rol_juego) {
                    document.getElementById("selectRol").value = jugador.rol_juego;
                }
            } else {
                fallbackCampos("NO LOCALIZADO");
            }
        } catch (e) { 
            fallbackCampos("ERROR CRÍTICO");
        }
    }

    function fallbackCampos(mensaje) {
        document.getElementById("perfUsuario").innerText = mensaje;
        document.getElementById("perfRango").innerText = mensaje;
        document.getElementById("perfPuntos").innerText = mensaje;
        document.getElementById("perfEstado").innerText = mensaje;
    }

    async function cargarPartidasDisponibles() {
        try {
            const { data: misiones } = await supabaseLocal
                .from("partidas")
                .select("id, nombre")
                .eq("activa", true);

            const select = document.getElementById("selectPartida");
            if (misiones && misiones.length > 0) {
                select.innerHTML = misiones.map(m => `<option value="${m.id}">${m.nombre}</option>`).join('');
            } else {
                select.innerHTML = `<option value="">-- No hay misiones activas --</option>`;
            }
        } catch (e) { console.error(e); }
    }

    async function actualizarEspecialidad() {
        const nuevoRol = document.getElementById("selectRol").value;
        try {
            await supabaseLocal
                .from("jugadores")
                .update({ rol_juego: nuevoRol })
                .ilike("usuario", usuarioLogueado);
        } catch (e) { console.error(e); }
    }

    async function confirmarDespliegueMision() {
        const partidaId = document.getElementById("selectPartida").value;
        if (!partidaId) { 
            alert("No hay misiones seleccionadas o activas en la red."); 
            return; 
        }
        
        try {
            const { error } = await supabaseLocal
                .from("jugadores")
                .update({ en_partida: true })
                .ilike("usuario", usuarioLogueado);
                
            if (error) throw error;

            alert("¡Despliegue autorizado! Tu posición ha sido transmitida al radar principal.");
            cargarDatosPerfil();
        } catch (e) { 
            alert("Error al enviar la orden de despliegue."); 
        }
    }

    function cerrarSesion() {
        localStorage.removeItem("usuarioLogueado");
        window.location.href = "login.html";
    }
</script>
</body>
</html>
