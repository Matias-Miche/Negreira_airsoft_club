html<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Airsoft Negreira</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tarjeta-perfil {
            background-color: #0b0b0b;
            padding: 30px;
            border-radius: 8px;
            border: 3px solid #4a5d4e;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #7fa984; text-transform: uppercase; }
        .avatar {
            width: 80px;
            height: 80px;
            background-color: #4a5d4e;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
        }
        .btn-salir {
            display: inline-block;
            background-color: #b33939;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="tarjeta-perfil">
        <h2>Panel de Operador</h2>
        <div class="avatar">🪖</div>
        <p>Bienvenido de nuevo, soldado:</p>
        <!-- Aquí se inyectará el nombre guardado -->
        <h3 id="nombre-usuario" style="color: #7fa984; font-size: 1.5rem;">Cargando...</h3>
        
        <p>Estado: <strong>Activo para combate</strong></p>
        
        <a href="index.html" class="btn-salir">Cerrar Sesión</a>
    </div>

    <script>
        // Leer los datos que guardamos en la página anterior
        const usuarioGuardado = localStorage.getItem('usuarioRegistrado');

        if (usuarioGuardado) {
            document.getElementById('nombre-usuario').innerText = usuarioGuardado;
        } else {
            // Si entra a esta página sin registrarse, lo mandamos a registrarse
            alert('No tienes perfil creado todavía.');
            window.location.href = 'registro.html';
        }
    </script>

</body>
</html>
