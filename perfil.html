<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Airsoft Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; padding: 20px; }
        .box { max-width: 700px; margin: auto; background: #0b0b0b; border: 2px solid #4a5d4e; border-radius: 10px; padding: 25px; }
        h2 { text-align: center; color: #7fa984; }
        .info { margin-top: 15px; padding: 12px; background: #222; border-radius: 6px; }
        button { margin-top: 15px; padding: 12px; border: none; background: #4a5d4e; color: white; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .admin-btn { background: #7fa984; color: black; display: block; width: 100%; margin-top: 15px; text-transform: uppercase; text-align: center; text-decoration: none; padding: 12px 0; border-radius: 5px; font-weight: bold; }
        .admin-btn:hover { background: #637d68; color: white; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Mi Perfil de Operador</h2>
        <div class="info" id="usuario">Cargando...</div>
        <div class="info" id="rol">Permiso: Cargando...</div>
        <div class="info" id="rolJuego">Rol de juego: Cargando...</div>
        <div class="info" id="entrada">Entrada: Cargando...</div>
        <div class="info" id="puntos">Puntos acumulados: Cargando...</div>
        <div id="panelAdmin"></div>
        <button onclick="cerrarSesion()" style="width:100%;">Cerrar sesión</button>
        <p style="text-align:center; margin-top:15px;"><a href="index.html" style="color:#8dc891; text-decoration:none;">⬅️ Volver al Marcador General</a></p>
    </div>
<script>
    async function cargarPerfil() {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) {
            window.location.href = "login.html";
            return;
        }

        // Corregido: Consulta unificada a la tabla real 'jugadores'
        const { data, error } = await window.supabaseClient
            .from("jugadores")
            .select("*")
            .eq("id", user.id)
            .single();

        if (error) {
            console.error(error);
            document.getElementById("usuario").innerText = "Error al cargar el perfil.";
            return;
        }

        document.getElementById("usuario").innerHTML = "<strong>Usuario:</strong> " + (data.usuario ? data.usuario.toUpperCase() : "Sin nombre");
        document.getElementById("rol").innerHTML = "<strong>Rango del Sistema:</strong> " + (data.rol || "usuario");
        document.getElementById("rolJuego").innerHTML = "<strong>Especialidad de Juego:</strong> " + (data.rol_juego || "No asignado");
        document.getElementById("entrada").innerHTML = "<strong>Modalidad de Entrada:</strong> " + (data.tipo_entrada || 0) + "€";
        document.getElementById("puntos").innerHTML = "<strong>Puntos Totales:</strong> " + (data.puntos || 0) + " PTS";

        if (data.rol === "administración" || data.rol === "administracion") {
            document.getElementById("panelAdmin").innerHTML = `
                <a class="admin-btn" href="admin.html">Panel de Control General</a>
                <a class="admin-btn" href="partidas.html" style="background:#4a5d4e; color:white;">Configurar Eventos / Partidas</a>
            `;
        }
    }

    async function cerrarSesion() {
        await window.supabaseClient.auth.signOut();
        window.location.href = "login.html";
    }

    cargarPerfil();
</script>
</body>
</html>
