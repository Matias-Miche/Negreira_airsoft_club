<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
body{background:#1a1a1a;color:white;font-family:Arial;padding:20px}
.box{background:#0b0b0b;padding:20px;border:2px solid #4a5d4e;border-radius:10px}
button{padding:10px;background:#4a5d4e;color:white;border:none;margin-top:10px}
</style>
</head>

<body>

<div class="box">
<h2>Perfil</h2>

<p id="user"></p>
<p id="rol"></p>
<p id="pts"></p>

<button onclick="salir()">Cerrar sesión</button>
</div>

<script>

const user = localStorage.getItem("usuarioRegistrado");

if(!user){
window.location.href="login.html";
}

async function cargar(){

const { data } = await supabaseClient
.from("jugadores")
.select("*")
.eq("usuario", user)
.single();

document.getElementById("user").innerText = data.usuario;
document.getElementById("rol").innerText = data.rol;
document.getElementById("pts").innerText = data.puntos + " pts";

}

function salir(){
localStorage.clear();
window.location.href="login.html";
}

cargar();

</script>

</body>
</html>
