<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Airsoft Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; padding: 20px; }
        .box { max-width: 700px; margin: auto; background: #0b0b0b; border: 2px solid #4a5d4e; border-radius: 10px; padding: 25px; }
        h2 { text-align: center; color: #7fa984; text-transform: uppercase; margin-bottom: 20px; }
        .info { margin-top: 15px; padding: 12px; background: #222; border-radius: 6px; border-left: 4px solid #4a5d4e; }
        label { display: block; margin-top: 15px; color: #7fa984; font-weight: bold; font-size: 0.9em; }
        select { width: 100%; padding: 10px; margin-top: 5px; background: #2b2b2b; color: white; border: 1px solid #4a5d4e; border-radius: 5px; }
        button { margin-top: 20px; padding: 12px; border: none; background: #4a5d4e; color: white; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; text-transform: uppercase; }
        button:hover { opacity: 0.9; }
        .btn-guardar { background: #7fa984; color: black; margin-top: 15px; }
        .admin-btn { background: #bd913c; color: black; display: block; width: 100%; margin-top: 15px; text-transform: uppercase; text-align: center; text-decoration: none; padding: 12px 0; border-radius: 5px; font-weight: bold; box-sizing: border-box; }
        #feedback { text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Mi Perfil de Operador</h2>
        <div class="info" id="usuario">Cargando operador...</div>
        <div class="info" id="rol">Permiso: Cargando...</div>
        <div class="info" id="puntos">Puntos acumulados: Cargando...</div>
        
        <label for="selectRolJuego">Especialidad en Campo (Rol):</label>
        <select id="selectRolJuego">
            <option value="Asalto">Asalto</option>
            <option value="Médico">Médico</option>
            <option value="Ametrallador">Ametrallador</option>
            <option value="Tirador designado">Tirador Designado</option>
        </select>

        <label for="selectEntrada">Modalidad de Entrada Obligatoria:</label>
        <select id="selectEntrada">
            <option value="5">Socio / Alquiler Básico (5€)</option>
            <option value="25">Entrada Completa + Equipación (25€)</option>
        </select>

        <button class="btn-guardar" onclick="actualizarDatosPerfil()">💾 Guardar Cambios Perfil</button>
        <div id="feedback"></div>

        <div id="panelAdmin"></div>
        
        <button onclick="cerrarSesion()">Cerrar sesión</button>
        <p style="text-align:center; margin-top:20px;"><a href="index.html" style="color:#8dc891; text-decoration:none; font-weight:bold;">⬅️ Volver al Marcador General</a></p>
    </div>

<script>
    let usuarioLogueadoId = null;

    async function cargarPerfil() {
        const { data: { session }, error: sessionError } = await window.supabaseClient.auth.getSession();
        
        if (sessionError || !session || !session.user) {
            window.location.href = "login.html";
            return;
        }

        usuarioLogueadoId = session.user.id;

        const { data, error } = await window.supabaseClient
            .from("jugadores")
            .select("*")
            .eq("id", usuarioLogueadoId)
            .maybeSingle();

        if (error) {
            console.error("Error Supabase:", error.message);
            document.getElementById("usuario").innerText = "⚠️ Error al conectar con el servidor.";
            return;
        }

        if (!data) {
            document.getElementById("usuario").innerHTML = "<strong>Operador:</strong> Perfil no inicializado.";
            return;
        }

        document.getElementById("usuario").innerHTML = "<strong>Operador:</strong> " + data.usuario.toUpperCase();
        document.getElementById("rol").innerHTML = "<strong>Rango del Sistema:</strong> " + data.rol;
        document.getElementById("puntos").innerHTML = "<strong>Puntos Totales:</strong> " + (data.puntos || 0) + " PTS";

        if (data.rol_juego) document.getElementById("selectRolJuego").value = data.rol_juego;
        document.getElementById("selectEntrada").value = data.tipo_entrada == 25 ? "25" : "5";

        if (data.rol === "administración" || data.rol === "administracion") {
            const panel = document.getElementById("panelAdmin");
            if (panel) {
                panel.innerHTML = `<a class="admin-btn" href="admin.html">⚙️ Entrar al Panel de Control General</a>`;
            }
        }
    }

    async function actualizarDatosPerfil() {
        const nuevoRolJuego = document.getElementById("selectRolJuego").value;
        const nuevaEntrada = parseInt(document.getElementById("selectEntrada").value);
        const feedback = document.getElementById("feedback");
        
        if (!usuarioLogueadoId) {
            feedback.innerText = "❌ Error: Sesión de usuario expirada.";
            feedback.style.color = "#ff8a8a";
            return;
        }

        feedback.innerText = "Guardando cambios...";
        feedback.style.color = "white";

        const { error } = await window.supabaseClient
            .from("jugadores")
            .update({
                rol_juego: nuevoRolJuego,
                tipo_entrada: nuevaEntrada
            })
            .eq("id", usuarioLogueadoId);

        if (error) {
            console.error("Error al actualizar:", error);
            feedback.innerText = "❌ Error: " + error.message;
            feedback.style.color = "#ff8a8a";
        } else {
            feedback.innerText = "✔️ ¡Perfil actualizado correctamente!";
            feedback.style.color = "#8dc891";
            setTimeout(() => { feedback.innerText = ""; }, 3000);
        }
    }

    async function cerrarSesion() {
        await window.supabaseClient.auth.signOut();
        window.location.href = "login.html";
    }

    document.addEventListener("DOMContentLoaded", cargarPerfil);
</script>
</body>
</html>
