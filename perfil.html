<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Airsoft Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; padding: 20px; }
        .box { max-width: 700px; margin: auto; background: #0b0b0b; border: 2px solid #4a5d4e; border-radius: 10px; padding: 25px; }
        h2 { text-align: center; color: #7fa984; text-transform: uppercase; margin-bottom: 10px; }
        .info { margin-top: 15px; padding: 12px; background: #222; border-radius: 6px; border-left: 4px solid #4a5d4e; }
        button { margin-top: 20px; padding: 12px 20px; border: none; background: #a94444; color: white; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; }
        button:hover { opacity: 0.9; }
        .admin-btn { background: #7fa984; color: black; margin-bottom: 10px; }
        #panelAdmin { margin-top: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Ficha Oficial de Operador</h2>
    
    <div class="info" id="usuario">Cargando...</div>
    <div class="info" id="rol">Cargando...</div>
    <div class="info" id="rolJuego">Cargando...</div>
    <div class="info" id="entrada">Cargando...</div>
    <div class="info" id="puntos">Cargando...</div>
    <div class="info" id="arsenal">Cargando...</div>

    <div id="panelAdmin"></div>

    <button onclick="cerrarSesion()">Cerrar sesión</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", cargarPerfil);

async function cargarPerfil() {
    const { data: { user } } = await supabaseClient.auth.getUser();

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const { data, error } = await supabaseClient
        .from("perfiles")
        .select("*")
        .eq("id", user.id)
        .single();

    if (error) {
        console.error(error);
        document.getElementById("usuario").innerText = "Error al cargar los datos del perfil.";
        return;
    }

    document.getElementById("usuario").innerHTML = "<strong>Operador:</strong> " + data.usuario.toUpperCase();
    document.getElementById("rol").innerHTML = "<strong>Permiso de Cuenta:</strong> " + data.rol;
    document.getElementById("rolJuego").innerHTML = "<strong>Rol de Combate:</strong> " + data.rol_juego;
    document.getElementById("entrada").innerHTML = "<strong>Precio de Entrada:</strong> " + data.tipo_entrada + "€";
    document.getElementById("puntos").innerHTML = "<strong>Puntos Acumulados:</strong> " + data.puntos + " PTS";
    document.getElementById("arsenal").innerHTML = "<strong>Arsenal Prestado:</strong> " + (data.arsenal_prestado || "Ninguno");

    if (data.rol === "administración") {
        document.getElementById("panelAdmin").innerHTML = `
            <button class="admin-btn" onclick="window.location.href='admin.html'">
                🛡️ PANEL DE ADMINISTRACIÓN SECRETO
            </button>
        `;
    }
}

async function cerrarSesion() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
}
</script>
</body>
</html>
