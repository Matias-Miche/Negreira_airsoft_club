<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Airsoft Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; padding: 20px; }
        .box { max-width: 700px; margin: auto; background: #0b0b0b; border: 2px solid #4a5d4e; border-radius: 10px; padding: 25px; }
        h2 { text-align: center; color: #7fa984; }
        .info { margin-top: 15px; padding: 12px; background: #222; border-radius: 6px; }
        button { margin-top: 15px; padding: 12px; border: none; background: #4a5d4e; color: white; cursor: pointer; border-radius: 5px; }
        button:hover { opacity: 0.9; }
        .admin-btn { background: #7fa984; color: black; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Mi Perfil</h2>
        <div class="info" id="usuario">Cargando...</div>
        <div class="info" id="rol"></div>
        <div class="info" id="rolJuego"></div>
        <div class="info" id="entrada"></div>
        <div class="info" id="puntos"></div>
        <div id="panelAdmin"></div>
        <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
<script>
    async function cargarPerfil() {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) {
            window.location.href = "login.html";
            return;
        }

        const { data, error } = await window.supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .single();

        if (error) {
            console.error(error);
            document.getElementById("usuario").innerText = "Error al cargar el perfil.";
            return;
        }

        document.getElementById("usuario").innerText = "Usuario: " + (data.username || "Sin nombre");
        document.getElementById("rol").innerText = "Permiso: " + (data.rol || "Usuario");
        document.getElementById("rolJuego").innerText = "Rol de juego: " + (data.rol_juego || "No asignado");
        document.getElementById("entrada").innerText = "Entrada: " + (data.tipo_entrada || 0) + "€";
        document.getElementById("puntos").innerText = "Puntos acumulados: " + (data.puntos || 0);

        if (data.rol === "administración" || data.rol === "administracion") {
            document.getElementById("panelAdmin").innerHTML = `
                <button class="admin-btn" onclick="window.location.href='admin.html'">
                    Panel de Administración
                </button>
            `;
        }
    }

    async function cerrarSesion() {
        await window.supabaseClient.auth.signOut();
        window.location.href = "login.html";
    }

    cargarPerfil();
</script>
</body>
</html>
