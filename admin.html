<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Dueños Airsoft</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
        .contenedor { max-width: 800px; margin: 0 auto; background: #0b0b0b; padding: 20px; border: 3px solid #7fa984; border-radius: 8px; }
        h1 { color: #7fa984; text-align: center; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #4a5d4e; }
        th { background-color: #4a5d4e; color: white; }
        .btn-puntos { background-color: #7fa984; color: black; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-puntos:hover { background-color: #637d68; color: white; }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Panel Secreto de Administración</h1>
    <p style="text-align: center;">Haz clic en el botón para otorgar +10 puntos al operador ganador.</p>

    <table>
        <thead>
            <tr>
                <th>Operador</th>
                <th>Rol Elegido</th>
                <th>Puntos</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tabla-jugadores">
            <!-- Los datos se cargan desde Supabase -->
        </tbody>
    </table>
</div>

    <script>
        // Claves del proyecto vinculadas
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_CH_3b10nSrV6PolJp3Q85w_sFCTAjrp";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function listarJugadores() {
            const { data, error } = await supabase.from('jugadores').select('*');
            const tbody = document.getElementById('tabla-jugadores');
            tbody.innerHTML = "";

            if (data) {
                data.forEach(jugador => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${jugador.usuario}</td>
                        <td>${jugador.rol}</td>
                        <td>${jugador.puntos} PTS</td>
                        <td><button class="btn-puntos" onclick="sumarPuntos('${jugador.usuario}', ${jugador.puntos})">+10 Pts</button></td>
                    `;
                    tbody.appendChild(fila);
                });
            }
        }

        async function sumarPuntos(usuario, puntosActuales) {
            const nuevosPuntos = puntosActuales + 10;
            await supabase
                .from('jugadores')
                .update({ puntos: nuevosPuntos })
                .eq('usuario', usuario);
            
            listarJugadores();
        }

        listarJugadores();
    </script>
</body>
</html>
