<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Táctico - Administración</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body {
            background: #080b09;
            color: #d1dad2;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(8, 11, 9, 0.92), rgba(8, 11, 9, 0.96)),
                linear-gradient(to right, #162419 1px, transparent 1px),
                linear-gradient(to bottom, #162419 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .panel-admin {
            width: 100%;
            max-width: 600px;
            background: #040605;
            border: 2px solid #223526;
            border-top: 6px solid #bfa054;
            border-radius: 4px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.8);
            margin-bottom: 25px;
        }

        h2 {
            color: #6da077;
            text-transform: uppercase;
            margin-top: 0;
            letter-spacing: 2px;
            font-size: 1.2rem;
            border-bottom: 1px dashed #223526;
            padding-bottom: 10px;
        }

        .campo-formulario {
            margin-bottom: 20px;
        }

        label {
            color: #a4b3a7;
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 10px;
            background: #0f1712;
            color: #e2e8e3;
            border: 1px solid #2d4533;
            border-radius: 3px;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #6da077;
            background: #142018;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e3825;
            color: #bfa054;
            border: 1px solid #4a6b52;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        button:hover {
            background: #274930;
            color: #ffd875;
        }
