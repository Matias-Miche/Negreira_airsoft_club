<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Dueños Airsoft</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
        .contenedor { max-width: 950px; margin: 0 auto; background: #0b0b0b; padding: 20px; border: 3px solid #7fa984; border-radius: 8px; }
        h1 { color: #7fa984; text-align: center; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #4a5d4e; font-size: 0.95rem; }
        th { background-color: #4a5d4e; color: white; }
        .btn-puntos { background-color: #7fa984; color: black; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-puntos:hover { background-color: #637d68; color: white; }
        .texto-prestamo { font-size: 0.85rem; color: #eccc68; text-align: left; }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Panel Secreto de Administración</h1>
    <p style="text-align: center;">Control de arsenales y asignación de puntos de victoria para Airsoft Negreira.</p>

    <table>
        <thead>
            <tr>
                <th>Operador</th>
                <th>Rol</th>
                <th>Arsenales a Prestar (Almacén) 📦</th>
                <th>Puntos</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tabla-jugadores">
            <!-- Los datos se cargan desde Supabase -->
        </tbody>
    </table>
</div>

    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_CH_3b10nSrV6PolJp3Q85w_sFCTAjrp";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Equipos de préstamo definidos exclusivamente para los administradores
        const equiposPrestamo = {
            "Medico": "Subfusil compacto (MP5/ARP9) + Chaleco porta-médico ligero + Distintivo de cruz roja.",
            "Ametrallador": "Réplica pesada de apoyo (LMG/M249) + Cargador de tambor + Bípode acoplado.",
            "Asalto": "Fusil de asalto estándar (M4/AK) + 3 Cargadores Mid-Cap + Mira de punto rojo.",
            "Tirador designado": "Fusil de tirador selectivo (DMR) + Mira telescópica con aumentos + Paquete de bolas de 0.30g.",
            "AT": "Fusil compacto de apoyo + Lanzagranadas acoplado + 2 Cartuchos de granadas de gas."
        };

        async function listarJugadores() {
            const { data, error } = await supabase.from('jugadores').select('*');
            const tbody = document.getElementById('tabla-jugadores');
            tbody.innerHTML = "";

            if (data) {
                data.forEach(jugador => {
                    const material = equiposPrestamo[jugador.rol] || "Equipo básico estándar";
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td><strong>${jugador.usuario}</strong></td>
                        <td>${jugador.rol}</td>
                        <td class="texto-prestamo">⚠️ Entregar: ${material}</td>
                        <td>${jugador.puntos} PTS</td>
                        <td><button class="btn-puntos" onclick="sumarPuntos('${jugador.usuario}', ${jugador.puntos})">+10 Pts</button></td>
                    `;
                    tbody.appendChild(fila);
                });
            }
        }

        async function sumarPuntos(usuario, puntosActuales) {
            const nuevosPuntos = puntosActuales + 10;
            await supabase
                .from('jugadores')
                .update({ puntos: nuevosPuntos })
                .eq('usuario', usuario);
            
            listarJugadores();
        }

        listarJugadores();
    </script>
</body>
</html>
