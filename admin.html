<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Comando - Negreira</title>
    <link rel="icon" href="data:,">
    <style>
        body {
            background: #080b09; color: #d1dad2; font-family: 'Courier New', Courier, monospace;
            padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: 
                linear-gradient(rgba(8, 11, 9, 0.92), rgba(8, 11, 9, 0.96)),
                linear-gradient(to right, #162419 1px, transparent 1px), linear-gradient(to bottom, #162419 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
        .contenedor-admin { width: 100%; max-width: 650px; background: #040605; border: 2px solid #223526; border-top: 6px solid #ff6b6b; border-radius: 4px; padding: 30px; box-sizing: border-box; box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.8); }
        h2 { color: #ff6b6b; text-transform: uppercase; margin-top: 0; letter-spacing: 2px; font-size: 1.4rem; text-align: center; border-bottom: 1px dashed #223526; padding-bottom: 12px; }
        .seccion-form { background: #0f1712; border: 1px solid #2d4533; padding: 20px; border-radius: 3px; margin-bottom: 20px; }
        .campo { margin-bottom: 15px; }
        label { color: #a4b3a7; display: block; margin-bottom: 6px; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 11px; background: #040605; color: #e2e8e3; border: 1px solid #2d4533; border-radius: 3px; box-sizing: border-box; font-family: inherit; }
        .grid-checkbox { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 5px; }
        .opcion-check { display: flex; align-items: center; gap: 8px; background: #040605; padding: 8px; border: 1px solid #1c2e21; border-radius: 3px; font-size: 0.8rem; }
        .opcion-check input { cursor: pointer; }
        button { width: 100%; padding: 12px; background: #3d1e1e; color: #ff6b6b; border: 1px solid #6b4a4a; border-radius: 3px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; margin-top: 10px; }
        button:hover { background: #522727; color: #ff8787; }
        .lista-misiones { margin-top: 20px; max-height: 200px; overflow-y: auto; }
        .mision-item { display: flex; justify-content: space-between; align-items: center; background: #090f0b; padding: 10px; border: 1px solid #1c2e21; margin-bottom: 8px; border-radius: 3px; font-size: 0.85rem; }
        .nav-links { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px dashed #223526; padding-top: 15px; font-size: 0.8rem; }
        .link-btn { color: #6da077; text-decoration: none; text-transform: uppercase; font-weight: bold; }
        .link-btn:hover { color: #ff6b6b; }
    </style>
</head>
<body>

    <div class="contenedor-admin">
        <h2>⚡ Panel de Comando: Crear Partida</h2>
        
        <div class="seccion-form">
            <div class="campo">
                <label>🗺️ Nombre Clave de la Misión:</label>
                <input type="text" id="nombreMision" placeholder="Ej: OPERACIÓN TORMENTA VERDE">
            </div>

            <div class="campo">
                <label>⚠️ Variables Especiales Activas:</label>
                <div class="grid-checkbox">
                    <div class="opcion-check">
                        <input type="checkbox" id="varJuggernaut">
                        <label for="varJuggernaut" style="margin:0; cursor:pointer;">🛡️ Juggernauts</label>
                    </div>
                    <div class="opcion-check">
                        <input type="checkbox" id="varVehiculos">
                        <label for="varVehiculos" style="margin:0; cursor:pointer;">🚜 Vehículos Pesados</label>
                    </div>
                    <div class="opcion-check">
                        <input type="checkbox" id="varMedicos">
                        <label for="varMedicos" style="margin:0; cursor:pointer;">🩹 Médicos</label>
                    </div>
                    <div class="opcion-check">
                        <input type="checkbox" id="varRespawn">
                        <label for="varRespawn" style="margin:0; cursor:pointer;">🔄 Respawn Limitado</label>
                    </div>
                </div>
            </div>

            <button onclick="registrarNuevaPartida()">Desplegar Misión</button>
        </div>

        <div class="seccion-form" style="border-color: #1a291f;">
            <label style="color: #6da077;">🛰️ Historial de Misiones:</label>
            <div class="lista-misiones" id="contenedorListaMisiones">
                <div style="text-align: center; color: #728576; font-size: 0.8rem; padding: 10px;">Sincronizando...</div>
            </div>
        </div>

        <div class="nav-links">
            <a href="index.html" class="link-btn">🛰️ Volver al Radar</a>
            <a href="perfil.html" class="link-btn" style="color:#bfa054;">🪪 Mi Perfil</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://wbcfszivrbuqfqnizarq.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndiY2Zzeml2cmJ1cWZxbml6YXJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTkyMjEsImV4cCI6MjA5NTQ3NTIyMX0.2iX7Twex3d96A9Iawg3zxvGAjFNLBqt81tSZgrzqA9s";

        let supabaseLocal;

        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(() => {
                try {
                    supabaseLocal = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    obtenerMisionesActuales();
                } catch (e) {
                    console.error(e);
                }
            }, 100);
        });

        async function obtenerMisionesActuales() {
            try {
                const { data: misiones, error } = await supabaseLocal
                    .from("partidas")
                    .select("*")
                    .order('id', { ascending: false });

                if (error) throw error;

                const contenedor = document.getElementById("contenedorListaMisiones");
                if (!misiones || misiones.length === 0) {
                    contenedor.innerHTML = "<div style='text-align: center; color: #728576; font-size:0.8rem;'>No hay misiones.</div>";
                    return;
                }

                let html = "";
                misiones.forEach(m => {
                    const distintivoEstado = m.activa ? "<span style='color:#6da077; font-weight:bold;'>[ACTIVA]</span>" : "<span style='color:#728576;'>[CONCLUIDA]</span>";
                    
                    let detalles = [];
                    if (m.juggernauts || m.juggernaut) detalles.push("Juggernauts");
                    if (m.vehiculos || m.vehiculo) detalles.push("Vehículos");
                    if (m.medicos) detalles.push("Médicos");
                    if (m.respawn_limitado) detalles.push("Respawn");
                    const textoDetalles = detalles.length > 0 ? " (" + detalles.join(", ") + ")" : "";

                    html += `<div class="mision-item">
                        <div><strong>${m.nombre.toUpperCase()}</strong>${textoDetalles}</div>
                        <div>${distintivoEstado}</div>
                    </div>`;
                });
                contenedor.innerHTML = html;
            } catch (err) {
                console.error(err);
            }
        }

        async function registrarNuevaPartida() {
            const nombre = document.getElementById("nombreMision").value.trim();
            if (!nombre) {
                alert("Introduce un nombre.");
                return;
            }

            const jugg = document.getElementById("varJuggernaut").checked;
            const vehic = document.getElementById("varVehiculos").checked;
            const med = document.getElementById("varMedicos").checked;
            const resp = document.getElementById("varRespawn").checked;

            try {
                // Desactivar misiones anteriores
                await supabaseLocal
                    .from("partidas")
                    .update({ activa: false })
                    .eq("activa", true);

                // Intento de inserción completo
                let objetoInsercion = {
                    nombre: nombre,
                    activa: true,
                    juggernauts: jugg,
                    vehiculos: vehic,
                    medicos: med,
                    respawn_limitado: resp
                };

                let { error } = await supabaseLocal
                    .from("partidas")
                    .insert([objetoInsercion]);

                // Si da error por las columnas nuevas, mandamos un envío simplificado de emergencia
                if (error) {
                    console.log("Reintentando inserción simplificada por incompatibilidad de columnas...");
                    const { error: errorS } = await supabaseLocal
                        .from("partidas")
                        .insert([{
                            nombre: nombre + (jugg ? " [JUGGERNAUT]" : "") + (vehic ? " [VEHÍCULOS]" : ""),
                            activa: true,
                            medicos: med,
                            respawn_limitado: resp
                        }]);
                    
                    if (errorS) throw errorS;
                }

                alert("🟢 Misión desplegada.");
                document.getElementById("nombreMision").value = "";
                document.getElementById("varJuggernaut").checked = false;
                document.getElementById("varVehiculos").checked = false;
                document.getElementById("varMedicos").checked = false;
                document.getElementById("varRespawn").checked = false;

                obtenerMisionesActuales();
            } catch (err) {
                console.error(err);
                alert("Error crítico del servidor. Comprueba las políticas RLS de la tabla 'partidas' en Supabase.");
            }
        }
    </script>
</body>
</html>
