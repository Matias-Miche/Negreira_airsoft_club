<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Airsoft Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; padding: 20px; }
        .contenedor { max-width: 1100px; margin: auto; background: #0b0b0b; padding: 25px; border: 3px solid #7fa984; border-radius: 10px; }
        h1, h2 { color: #7fa984; text-align: center; text-transform: uppercase; margin-bottom: 20px; }
        .formulario { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #4a5d4e; margin-bottom: 30px; }
        input, select { width: 100%; margin-bottom: 15px; padding: 12px; background: #2b2b2b; color: white; border: 1px solid #4a5d4e; border-radius: 5px; box-sizing: border-box; }
        .btn { background: #7fa984; color: black; border: none; padding: 12px 18px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; width: 100%; text-transform: uppercase; }
        .btn:hover { background: #637d68; color: white; }
        .tabla-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #4a5d4e; text-align: center; }
        th { background: #4a5d4e; }
        .estado { margin-top: 15px; text-align: center; color: #ccc; }
        @media(max-width:768px) { table { font-size: 0.85rem; } th, td { padding: 8px; } }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Panel Secreto de Administración</h1>
    <p style="text-align:center;"><a href="perfil.html" style="color:#7fa984; text-decoration:none; font-weight:bold;">⬅️ Volver a mi Perfil</a></p>
    <br>

    <div class="formulario">
        <h2>Crear Nueva Partida Pública</h2>
        <input type="text" id="nombre-partida" placeholder="Ej: Operación Negreira">
        <input type="date" id="fecha-partida">
        <button class="btn" onclick="crearPartida()">Publicar Partida</button>
        <div class="estado" id="estado-panel"></div>
    </div>

    <h2>Operadores Alistados</h2>
    <div class="tabla-responsive">
        <table>
            <thead>
                <tr>
                    <th>Operador</th>
                    <th>Rol de Juego</th>
                    <th>Entrada</th>
                    <th>Arsenal Prestado</th>
                    <th>Puntos</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-jugadores">
                <tr><td colspan="6">Verificando credenciales perimetrales...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Control de acceso estricto en cliente
    document.addEventListener("DOMContentLoaded", comprobarAccesoAdmin);

    async function comprobarAccesoAdmin() {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) { window.location.href = "login.html"; return; }

        const { data, error } = await window.supabaseClient
            .from("jugadores")
            .select("rol")
            .eq("id", user.id)
            .single();

        if (error || !data || (data.rol !== "administración" && data.rol !== "administracion")) {
            alert("Acceso denegado. No posees credenciales de administración.");
            window.location.href = "perfil.html";
        } else {
            cargarOperadores();
        }
    }

    async function cargarOperadores() {
        const { data: jugadores, error } = await window.supabaseClient
            .from("jugadores")
            .select("*")
            .order("usuario", { ascending: true });

        if (error) {
            console.error("Error al cargar operadores:", error);
            return;
        }

        const tbody = document.getElementById("tabla-jugadores");
        tbody.innerHTML = "";

        if (jugadores && jugadores.length > 0) {
            jugadores.forEach(j => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${j.usuario.toUpperCase()}</strong></td>
                        <td>
                            <select id="rol-${j.usuario}" style="margin:0; padding:6px;">
                                <option value="Asalto" ${j.rol_juego === 'Asalto' ? 'selected' : ''}>Asalto</option>
                                <option value="Medico" ${j.rol_juego === 'Medico' || j.rol_juego === 'Médico' ? 'selected' : ''}>Médico</option>
                                <option value="Ametrallador" ${j.rol_juego === 'Ametrallador' ? 'selected' : ''}>Ametrallador</option>
                                <option value="Tirador designado" ${j.rol_juego === 'Tirador designado' || j.rol_juego === 'Tirador' ? 'selected' : ''}>Tirador</option>
                            </select>
                        </td>
                        <td>
                            <input type="number" id="entrada-${j.usuario}" value="${j.tipo_entrada || 0}" style="width:60px; margin:0; padding:6px;">
                        </td>
                        <td>
                            <input type="text" id="arsenal-${j.usuario}" value="${j.arsenal_prestado || ''}" placeholder="Ninguno" style="width:130px; margin:0; padding:6px;">
                        </td>
                        <td>
                            <input type="number" id="puntos-${j.usuario}" value="${j.puntos || 0}" style="width:70px; margin:0; padding:6px;">
                        </td>
                        <td>
                            <button class="btn" onclick="actualizarOperador('${j.usuario}')" style="padding:6px 12px; width:auto; font-size:0.85rem;">Guardar</button>
                        </td>
                    </tr>
                `;
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="6">No se encontraron operadores alistados.</td></tr>`;
        }
    }

    async function actualizarOperador(usuario) {
        const nuevoRolJuego = document.getElementById(`rol-${usuario}`).value;
        const nuevaEntrada = document.getElementById(`entrada-${usuario}`).value;
        const nuevoArsenal = document.getElementById(`arsenal-${usuario}`).value;
        const nuevosPuntos = document.getElementById(`puntos-${usuario}`).value;

        // CORRECCIÓN: Se actualiza 'rol_juego' para EVITAR machacar la columna 'rol' y no perder los privilegios de administración
        const { error } = await window.supabaseClient
            .from("jugadores")
            .update({
                rol_juego: nuevoRolJuego,
                tipo_entrada: Number(nuevaEntrada),
                arsenal_prestado: nuevoArsenal,
                puntos: Number(nuevosPuntos)
            })
            .eq("usuario", usuario);

        if (error) {
            alert("Error al actualizar: " + error.message);
        } else {
            alert(`¡Operador ${usuario} actualizado con éxito!`);
            cargarOperadores();
        }
    }

    async function crearPartida() {
        const nombre = document.getElementById("nombre-partida").value.trim();
        const fecha = document.getElementById("fecha-partida").value;
        const estado = document.getElementById("estado-panel");

        if (!nombre || !fecha) {
            estado.innerText = "Completa todos los campos";
            return;
        }

        estado.innerText = "Publicando...";

        await window.supabaseClient
            .from("partidas")
            .update({ activa: false })
            .eq("activa", true);

        const { error } = await window.supabaseClient
            .from("partidas")
            .insert([{ nombre, fecha, activa: true }]);

        if (error) {
            estado.innerText = "Error: " + error.message;
        } else {
            estado.innerText = "Partida publicada correctamente";
            document.getElementById("nombre-partida").value = "";
            document.getElementById("fecha-partida").value = "";
        }
    }
</script>
</body>
</html>
