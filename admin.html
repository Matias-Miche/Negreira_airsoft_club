<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Airsoft Negreira</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
            background: #0b0b0b;
            padding: 25px;
            border: 3px solid #7fa984;
            border-radius: 10px;
        }

        h1, h2 {
            color: #7fa984;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .formulario {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #4a5d4e;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            margin-bottom: 15px;
            padding: 12px;
            background: #2b2b2b;
            color: white;
            border: 1px solid #4a5d4e;
            border-radius: 5px;
        }

        .btn {
            background: #7fa984;
            color: black;
            border: none;
            padding: 12px 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #637d68;
            color: white;
        }

        .tabla-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #4a5d4e;
            text-align: center;
        }

        th {
            background: #4a5d4e;
        }

        .texto-prestamo {
            text-align: left;
            color: #f7d794;
            font-size: 0.9rem;
        }

        .estado {
            margin-top: 15px;
            text-align: center;
            color: #ccc;
        }

        @media(max-width:768px) {
            table {
                font-size: 0.85rem;
            }
            th, td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">
    <h1>Panel Secreto de Administración</h1>

    <div class="formulario">
        <h2>Crear Nueva Partida Pública</h2>
        <input type="text" id="nombre-partida" placeholder="Ej: Operación Negreira">
        <input type="date" id="fecha-partida">
        <button class="btn" onclick="crearPartida()">Publicar Partida</button>
        <div class="estado" id="estado-panel"></div>
    </div>

    <h2>Operadores Alistados</h2>
    <div class="tabla-responsive">
        <table>
            <thead>
                <tr>
                    <th>Operador</th>
                    <th>Rol</th>
                    <th>Entrada</th>
                    <th>Arsenal Prestado</th>
                    <th>Puntos</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-jugadores"></tbody>
        </table>
    </div>
</div>
