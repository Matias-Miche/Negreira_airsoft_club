<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Base de Datos Online | Supabase</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            padding: 40px;
        }

        h1 {
            color: #7fa984;
            margin-bottom: 20px;
        }

        button {
            background: #4a5d4e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        button:hover {
            background: #637d68;
        }

        #resultado {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 10px;
            overflow: auto;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
        }
    </style>
</head>

<body>

    <h1>Mis Datos desde Supabase</h1>

    <button onclick="obtenerDatos()">
        Cargar Datos
    </button>

    <div id="resultado">
        Esperando datos...
    </div>

    <script>
        // =========================================================================
        // CONFIGURACIÓN SUPABASE (Reemplaza estos valores con los de tu proyecto)
        // =========================================================================
        
        const SUPABASE_URL = "https://TU_PROYECTO_ID.supabase.co"; 
        const SUPABASE_ANON_KEY = "TU_CLAVE_PUBLICA_ANON_KEY";
        const NOMBRE_TABLA = "tu_tabla_aqui";

        // =========================================================================
        // INICIALIZACIÓN DEL CLIENTE
        // =========================================================================
        
        const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =========================================================================
        // FUNCIÓN PARA LEER DATOS
        // =========================================================================
        
        async function obtenerDatos() {
            const resultado = document.getElementById("resultado");
            resultado.innerHTML = "Cargando datos...";

            try {
                // Consulta a la base de datos
                const { data, error } = await clienteSupabase
                    .from(NOMBRE_TABLA)
                    .select("*");

                // Manejo de errores devueltos por la API de Supabase
                if (error) {
                    resultado.innerHTML = "<strong>Error de Supabase:</strong> " + error.message;
                    console.error("Detalles del error:", error);
                    return;
                }

                // Validar si la tabla está vacía
                if (data.length === 0) {
                    resultado.innerHTML = "La tabla está vacía o las políticas RLS no permiten leer los datos.";
                    return;
                }

                // Mostrar los datos formateados en pantalla
                resultado.innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
                console.log("Datos cargados con éxito:", data);

            } catch (err) {
                // Manejo de errores críticos del sistema o de red
                resultado.innerHTML = "<strong>Error crítico:</strong> No se pudo conectar con el servidor.";
                console.error("Error de conexión:", err);
            }
        }
    </script>

</body>
</html>
