```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Base de Datos Online | Supabase</title>

    <!-- SDK REAL DE SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body{
            background:#1a1a1a;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            padding:40px;
        }

        h1{
            color:#7fa984;
            margin-bottom:20px;
        }

        button{
            background:#4a5d4e;
            color:white;

            border:none;
            padding:12px 20px;

            border-radius:5px;
            cursor:pointer;

            font-size:1rem;
            margin-bottom:20px;
        }

        button:hover{
            background:#637d68;
        }

        #resultado{
            background:#2b2b2b;
            padding:20px;
            border-radius:10px;
            overflow:auto;
        }

        pre{
            white-space:pre-wrap;
            word-wrap:break-word;
        }

    </style>

</head>

<body>

    <h1>Mis Datos desde Supabase</h1>

    <button onclick="obtenerDatos()">
        Cargar Datos
    </button>

    <div id="resultado">
        Esperando datos...
    </div>

    <script>

        // ============================
        // CONFIGURACIÓN SUPABASE
        // ============================

        const SUPABASE_URL =
        "https://TU-PROYECTO.supabase.co";

        const SUPABASE_ANON_KEY =
        "TU_CLAVE_PUBLICA_AQUI";

        // Crear cliente

        const clienteSupabase =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        // ============================
        // FUNCIÓN PARA LEER DATOS
        // ============================

        async function obtenerDatos(){

            const resultado =
            document.getElementById("resultado");

            resultado.innerHTML =
            "Cargando datos...";

            // CONSULTA

            const { data, error } =
            await clienteSupabase
            .from("nombre_de_tu_tabla")
            .select("*");

            // ERRORES

            if(error){

                resultado.innerHTML =
                "Error: " + error.message;

                console.error(error);

                return;
            }

            // MOSTRAR DATOS

            resultado.innerHTML =
            "<pre>" +
            JSON.stringify(data, null, 2) +
            "</pre>";

            console.log(data);
        }

    </script>

</body>
</html>
