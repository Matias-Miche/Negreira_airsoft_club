<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de Operadores - Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body {
            background: #080b09;
            color: #d1dad2;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(8, 11, 9, 0.92), rgba(8, 11, 9, 0.96)),
                linear-gradient(to right, #162419 1px, transparent 1px),
                linear-gradient(to bottom, #162419 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .contenedor-login {
            width: 100%;
            max-width: 450px;
            background: #040605;
            border: 2px solid #223526;
            border-top: 6px solid #bfa054;
            border-radius: 4px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .contenedor-login::before {
            content: "SECURE-LOGIN // PORTAL";
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 0.65rem;
            color: #38523f;
            letter-spacing: 1px;
        }

        h2 {
            color: #6da077;
            text-transform: uppercase;
            margin-top: 10px;
            letter-spacing: 2px;
            font-size: 1.2rem;
            text-align: center;
            border-bottom: 1px dashed #223526;
            padding-bottom: 12px;
        }

        .campo { margin-bottom: 20px; }

        label {
            color: #a4b3a7;
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            background: #0f1712;
            color: #e2e8e3;
            border: 1px solid #2d4533;
            border-radius: 3px;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #bfa054;
            background: #142018;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e3825;
            color: #bfa054;
            border: 1px solid #4a6b52;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        button:hover { background: #274930; color: #ffd875; }

        .enlace-cambio {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #728576;
            font-size: 0.8rem;
            text-decoration: none;
        }
        .enlace-cambio:hover { color: #6da077; }
    </style>
</head>
<body>

    <div class="contenedor-login">
        <h2>🔑 Acceso Operador</h2>

        <div class="campo">
            <label>🌲 Indicativo Militar (Usuario):</label>
            <input type="text" id="loginUsuario" placeholder="Introduce tu nombre registrado">
        </div>

        <div class="campo">
            <label>🔒 Clave de Autenticación:</label>
            <input type="password" id="loginPassword" placeholder="Introduce tu contraseña">
        </div>

        <button onclick="iniciarSesionDirecta()">Ingresar al Sistema</button>
        
        <a href="registro.html" class="enlace-cambio">¿No tienes cuenta? Registrarse en la red</a>
        <a href="index.html" class="enlace-cambio" style="color: #51755a;">⬅️ Volver a la terminal principal</a>
    </div>

<script>
    async function iniciarSesionDirecta() {
        const usuario = document.getElementById("loginUsuario").value.trim();
        const password = document.getElementById("loginPassword").value;

        if (!usuario || !password) {
            alert("Por favor, introduce tus credenciales completas.");
            return;
        }

        // CONTROL EXTRA: Evita cuelgues si supabaseClient no cargó correctamente
        if (typeof window.supabaseClient === 'undefined') {
            alert("ERROR CRÍTICO: No se puede conectar con 'supabase.js'. Revisa tus claves.");
            return;
        }

        try {
            const { data: jugador, error } = await window.supabaseClient
                .from("jugadores")
                .select("usuario, contrasena, es_admin")
                .eq("usuario", usuario)
                .maybeSingle();

            if (error) {
                alert("Error de respuesta de las tablas en Supabase. Verifica las columnas.");
                return;
            }

            if (jugador && jugador.contrasena === password) {
                localStorage.setItem("usuarioLogueado", jugador.usuario);
                alert(`¡Conexión establecida!`);
                
                if (jugador.es_admin === true) {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "index.html";
                }
            } else {
                alert("ACCESO RECHAZADO: Usuario o contraseña incorrectos.");
            }
        } catch (err) {
            alert("Error general de conexión de red.");
        }
    }
</script>
</body>
</html>
