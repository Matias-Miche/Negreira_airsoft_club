<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Airsoft Negreira</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contenedor-login {
            background-color: #0b0b0b;
            padding: 30px;
            border-radius: 8px;
            border: 3px solid #4a5d4e;
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #7fa984;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-grupo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
        input {
            width: 100%;
            padding: 10px;
            background-color: #2b2b2b;
            border: 1px solid #4a5d4e;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-accion {
            width: 100%;
            background-color: #4a5d4e;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-accion:hover {
            background-color: #637d68;
        }
        .enlace-volver {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #7fa984;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="contenedor-login">
        <h2>Acceso Operadores</h2>
        
        <form id="formLogin">
            <div class="form-grupo">
                <label for="login-usuario">Usuario:</label>
                <input type="text" id="login-usuario" required>
            </div>
            
            <div class="form-grupo">
                <label for="login-contra">Contraseña:</label>
                <input type="password" id="login-contra" required>
            </div>
            
            <button type="submit" class="btn-accion">Iniciar Sesión</button>
        </form>

        <a href="index.html" class="enlace-volver">Volver al Inicio</a>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();

            const usuarioIngresado = document.getElementById('login-usuario').value;
            const contraIngresada = document.getElementById('login-contra').value;

            // Recuperamos las credenciales guardadas en el registro
            const usuarioGuardado = localStorage.getItem('usuarioRegistrado');
            const contraGuardada = localStorage.getItem('contraRegistrada');

            // Validamos si coinciden
            if (usuarioIngresado === usuarioGuardado && contraIngresada === contraGuardada) {
                alert('¡Acceso autorizado!');
                window.location.href = 'partidas.html'; // Te envía a la nueva página de partidas
            } else {
                alert('Usuario o contraseña incorrectos. Regístrate si aún no tienes cuenta.');
            }
        });
    </script>

</body>
</html>
