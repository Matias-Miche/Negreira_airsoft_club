<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
body{background:#1a1a1a;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#0b0b0b;padding:30px;border:2px solid #4a5d4e;border-radius:10px;width:100%;max-width:400px}
input{width:100%;padding:10px;margin:10px 0;background:#2b2b2b;color:white}
button{width:100%;padding:10px;background:#4a5d4e;color:white;border:none}
</style>
</head>

<body>

<div class="box">
<h2>Login</h2>

<input id="user">
<input id="pass" type="password">

<button onclick="login()">Entrar</button>
<p id="msg"></p>
</div>

<script>

async function login(){

const user = document.getElementById("user").value;
const pass = document.getElementById("pass").value;

const { data, error } = await supabaseClient
.from("jugadores")
.select("*")
.eq("usuario", user)
.eq("contrasena", pass)
.single();

if(data){

localStorage.setItem("usuarioRegistrado", user);
window.location.href="perfil.html";

}else{
document.getElementById("msg").innerText="Error login";
}

}

</script>

</body>
</html>
