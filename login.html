<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Airsoft Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; padding: 20px; margin: 0; }
        .box { max-width: 450px; margin: 80px auto; background: #0b0b0b; border: 2px solid #4a5d4e; border-radius: 10px; padding: 30px; box-sizing: border-box; }
        h2 { text-align: center; color: #7fa984; text-transform: uppercase; margin-bottom: 25px; margin-top: 0; }
        label { display: block; margin-top: 15px; color: #7fa984; font-weight: bold; font-size: 0.9em; }
        input { width: 100%; padding: 12px; margin-top: 5px; background: #2b2b2b; color: white; border: 1px solid #4a5d4e; border-radius: 5px; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: #bd913c; outline: none; }
        button { margin-top: 25px; padding: 12px; border: none; background: #4a5d4e; color: white; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; text-transform: uppercase; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #5c7461; }
        #mensajeFeedback { text-align: center; margin-top: 15px; font-weight: bold; min-height: 20px; }
        .enlace-volver { display: block; text-align: center; margin-top: 20px; color: #8dc891; text-decoration: none; font-weight: bold; font-size: 0.95em; }
        .enlace-volver:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Autenticación de Operador</h2>
        
        <label for="usuarioInput">Nombre de Operador (Nickname):</label>
        <input type="text" id="usuarioInput" placeholder="Tu nombre de jugador" required>

        <label for="passwordInput">Contraseña:</label>
        <input type="password" id="passwordInput" placeholder="••••••••" required>

        <button onclick="iniciarSesion()">🔑 Validar Credenciales</button>
        
        <div id="mensajeFeedback"></div>

        <a href="registro.html" class="enlace-volver">¿No tienes ficha? Regístrate aquí</a>
        <a href="index.html" class="enlace-volver" style="color: #aaa; font-size: 0.85em; margin-top: 10px;">⬅️ Volver al Inicio</a>
    </div>

<script>
    async function iniciarSesion() {
        const usuarioForm = document.getElementById("usuarioInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const feedback = document.getElementById("mensajeFeedback");

        if (!usuarioForm || !password) {
            feedback.innerText = "❌ Completa los campos solicitados.";
            feedback.style.color = "#ff8a8a";
            return;
        }

        feedback.innerText = "Verificando identidad en el campo...";
        feedback.style.color = "#bd913c";

        // Reconstruimos el mismo correo virtual usado en el registro
        const usuarioLimpio = usuarioForm.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
        const emailVirtual = `${usuarioLimpio}@negreira.com`;

        // Intentar loguear en Supabase usando el correo fantasma
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({
            email: emailVirtual,
            password: password
        });

        if (error) {
            console.error("Error Login:", error.message);
            feedback.innerText = "❌ Nombre de jugador o contraseña incorrectos.";
            feedback.style.color = "#ff8a8a";
        } else {
            feedback.innerText = "✔️ Acceso concedido. Cargando perfil...";
            feedback.style.color = "#8dc891";
            
            setTimeout(() => {
                window.location.href = "perfil.html";
            }, 1000);
        }
    }
</script>
</body>
</html>
