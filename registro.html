<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Airsoft Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .box { background: #0b0b0b; padding: 30px; border: 2px solid #4a5d4e; border-radius: 10px; width: 100%; max-width: 450px; }
        h2 { text-align: center; margin-bottom: 20px; color: #7fa984; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #2b2b2b; color: white; border: 1px solid #444; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #4a5d4e; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #estado { text-align: center; margin-top: 15px; font-weight: bold; color: #ff6b6b; }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #7fa984; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>Crear Cuenta de Operador</h2>
    <input id="usuario" type="text" placeholder="Nombre de usuario (ej: lobo)">
    <input id="password" type="password" placeholder="Contraseña">
    <input id="password2" type="password" placeholder="Repetir contraseña">
    
    <button id="btnRegistro" onclick="registrar()">Crear cuenta</button>
    <p id="estado"></p>

    <div class="links">
        <a href="login.html">Ya tengo cuenta - Iniciar Sesión</a>
    </div>
</div>

<script>
async function registrar() {
    const usuario = document.getElementById("usuario").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;
    const estado = document.getElementById("estado");

    estado.innerText = "";
    estado.style.color = "#ff6b6b";

    if (!usuario || !password || !password2) {
        estado.innerText = "Completa todos los campos";
        return;
    }
    if (password !== password2) {
        estado.innerText = "Las contraseñas no coinciden";
        return;
    }
    if (password.length < 6) {
        estado.innerText = "Mínimo 6 caracteres para la contraseña";
        return;
    }

    document.getElementById("btnRegistro").disabled = true;
    const email = usuario + "@airsoft.local";

    // 1. Crear el usuario en la autenticación de Supabase
    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
    });

    if (error) {
        estado.innerText = error.message;
        document.getElementById("btnRegistro").disabled = false;
        return;
    }

    // 2. Insertar el perfil público correspondiente en la tabla 'perfiles'
    if (data && data.user) {
        const { error: perfilError } = await supabaseClient
            .from("perfiles")
            .insert([{
                id: data.user.id,
                usuario: usuario,
                rol: usuario.includes("admin") ? "administración" : "usuario",
                rol_juego: "Sin asignar",
                tipo_entrada: 0,
                puntos: 0,
                en_partida: false,
                arsenal_prestado: ""
            }]);

        if (perfilError) {
            estado.innerText = "Error creando perfil: " + perfilError.message;
            document.getElementById("btnRegistro").disabled = false;
            return;
        }
    }

    estado.style.color = "#7fa984";
    estado.innerText = "Cuenta y perfil creados correctamente.";
    
    setTimeout(() => {
        window.location.href = "login.html";
    }, 2000);
}
</script>
</body>
</html>
