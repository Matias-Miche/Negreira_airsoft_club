<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Airsoft Negreira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; padding: 20px; margin: 0; }
        .box { max-width: 450px; margin: 60px auto; background: #0b0b0b; border: 2px solid #4a5d4e; border-radius: 10px; padding: 30px; box-sizing: border-box; }
        h2 { text-align: center; color: #7fa984; text-transform: uppercase; margin-bottom: 25px; margin-top: 0; }
        label { display: block; margin-top: 15px; color: #7fa984; font-weight: bold; font-size: 0.9em; }
        input { width: 100%; padding: 12px; margin-top: 5px; background: #2b2b2b; color: white; border: 1px solid #4a5d4e; border-radius: 5px; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: #bd913c; outline: none; }
        button { margin-top: 25px; padding: 12px; border: none; background: #4a5d4e; color: white; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; text-transform: uppercase; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #5c7461; }
        #mensajeFeedback { text-align: center; margin-top: 15px; font-weight: bold; min-height: 20px; }
        .enlace-volver { display: block; text-align: center; margin-top: 20px; color: #8dc891; text-decoration: none; font-weight: bold; font-size: 0.95em; }
        .enlace-volver:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Registro de Recluta</h2>
        
        <label for="usuarioInput">Nombre de Operador (Nickname):</label>
        <input type="text" id="usuarioInput" placeholder="Ej: Ghost_94" required>

        <label for="emailInput">Correo Electrónico:</label>
        <input type="email" id="emailInput" placeholder="correo@ejemplo.com" required>

        <label for="passwordInput">Contraseña de Acceso:</label>
        <input type="password" id="passwordInput" placeholder="••••••••" required>

        <button onclick="registrarNuevoUsuario()">⚔️ Crear Ficha de Combate</button>
        
        <div id="mensajeFeedback"></div>

        <a href="login.html" class="enlace-volver">¿Ya tienes cuenta? Inicia sesión aquí</a>
        <a href="index.html" class="enlace-volver" style="color: #aaa; font-size: 0.85em; margin-top: 10px;">⬅️ Volver al Inicio</a>
    </div>

<script>
    async function registrarNuevoUsuario() {
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const usuarioForm = document.getElementById("usuarioInput").value.trim();
        const feedback = document.getElementById("mensajeFeedback");

        // Validaciones básicas previas obligatorias
        if (!email || !password || !usuarioForm) {
            feedback.innerText = "❌ Por favor, rellena todos los campos.";
            feedback.style.color = "#ff8a8a";
            return;
        }

        if (password.length < 6) {
            feedback.innerText = "❌ La contraseña debe tener al menos 6 caracteres.";
            feedback.style.color = "#ff8a8a";
            return;
        }

        feedback.innerText = "Procesando alta en el sistema...";
        feedback.style.color = "#bd913c";

        // PASO 1: Registrar la cuenta en el sistema de Autenticación de Supabase
        const { data, error } = await window.supabaseClient.auth.signUp({
            email: email,
            password: password
        });

        if (error) {
            console.error("Error Auth:", error.message);
            feedback.innerText = "❌ Error en Registro: " + error.message;
            feedback.style.color = "#ff8a8a";
            return;
        }

        // PASO 2: Si el usuario se creó en Auth, inicializar su fila en la tabla pública 'jugadores'
        if (data && data.user) {
            const { error: errorTabla } = await window.supabaseClient
                .from("jugadores")
                .insert([
                    {
                        id: data.user.id, // Sincronizamos exactamente la ID generada por Auth
                        usuario: usuarioForm,
                        rol: "jugador", // Rango raso por defecto del sistema
                        rol_juego: "Asalto", // Especialidad inicial por defecto
                        puntos: 0, // Inicia con marcador a cero
                        tipo_entrada: 5, // Tarifa estándar de socio / alquiler básico
                        en_partida: false // Inicia sin estar apuntado a la misión
                    }
                ]);

            if (errorTabla) {
                console.error("Error al inicializar perfil público:", errorTabla.message);
                feedback.innerHTML = `⚠️ Cuenta creada, pero hubo un error de base de datos:<br><span style="font-size:0.85em;">${errorTabla.message}</span>`;
                feedback.style.color = "#ffbd4a";
            } else {
                feedback.innerText = "✔️ ¡Ficha creada correctamente! Redirigiendo...";
                feedback.style.color = "#8dc891";
                
                // Pequeña espera para que el usuario vea el mensaje de éxito antes de saltar al login
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            }
        } else {
            feedback.innerText = "❌ No se pudo validar la sesión del nuevo usuario.";
            feedback.style.color = "#ff8a8a";
        }
    }
</script>
</body>
</html>
