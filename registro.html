<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Airsoft Negreira</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

body{
background:#1a1a1a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.box{
background:#0b0b0b;
padding:30px;
border:2px solid #4a5d4e;
border-radius:10px;
width:100%;
max-width:420px;
}

input,select{
width:100%;
padding:10px;
margin:10px 0;
background:#2b2b2b;
color:white;
border:1px solid #4a5d4e;
border-radius:5px;
}

button{
width:100%;
padding:10px;
background:#4a5d4e;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#637d68;
}

.rol-option{
display:flex;
align-items:center;
gap:10px;
}

</style>
</head>

<body>

<div class="box">

<h2>Crear cuenta</h2>

<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">

<select id="rol">

<option value="Medico">🩹 Médico</option>
<option value="Ametrallador">🪖 Ametrallador</option>
<option value="Asalto">💥 Asalto</option>
<option value="Tirador designado">🎯 Tirador Designado</option>
<option value="AT">🚀 AT Anti-Tanque</option>

</select>

<button onclick="registrar()">Crear cuenta</button>

<p id="msg"></p>

</div>

<script>

async function registrar(){

const usuario = document.getElementById("user").value.trim();
const pass = document.getElementById("pass").value;
const rol = document.getElementById("rol").value;
const msg = document.getElementById("msg");

if(usuario.length < 3){
msg.innerText = "Usuario demasiado corto";
return;
}

if(pass.length < 6){
msg.innerText = "Contraseña mínimo 6 caracteres";
return;
}

msg.innerText = "Creando cuenta...";

// comprobar duplicado
const { data: existe } = await supabaseClient
.from("jugadores")
.select("usuario")
.eq("usuario", usuario)
.maybeSingle();

if(existe){
msg.innerText = "Ese usuario ya existe";
return;
}

// insertar
const { error } = await supabaseClient
.from("jugadores")
.insert([{
usuario,
contrasena: pass,
rol,
puntos:0,
en_partida:false,
tipo_entrada:"5"
}]);

if(error){
console.log(error);
msg.innerText = "Error de conexión con Supabase";
return;
}

localStorage.setItem("usuarioRegistrado", usuario);

msg.innerText = "Cuenta creada ✔";

setTimeout(()=>{
window.location.href="perfil.html";
},1000);

}

</script>

</body>
</html>
